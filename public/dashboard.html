<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A9 Marketing System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ========== Light Theme (default) ========== */
  :root, [data-theme="light"] {
    --g-primary: #16b378;
    --g-primary-dark: #009058;
    --g-primary-dim: #007548;
    --g-primary-light: rgba(22,179,120,0.12);
    --g-primary-emphasis: #b1ffe2;
    --g-body: #262633;
    --g-medium-text: #494949;
    --g-light-text: #929299;
    --g-bg: #ffffff;
    --g-bg-secondary: #f7f7f7;
    --g-bg-tertiary: rgba(217,217,217,0.6);
    --g-border: #d9d9d9;
    --g-border-light: #e8e8e8;
    --g-error: #d0021b;
    --g-warning: #dd962c;
    --g-info: #3b82f6;
    --g-selection: rgba(22,179,120,0.12);
    --g-overlay-bg: rgba(38,38,51,0.5);
    --g-map-marker: #16b378;
    --g-chart-axis: #494949;
    --g-chart-split: #e8e8e8;
    --g-badge-a: #d0021b;
    --g-badge-b: #dd962c;
    --g-badge-c: #3b82f6;
    --g-badge-active: #16b378;
    --g-badge-signed: #009058;
    --g-badge-negotiating: #929299;
    --g-badge-ended: #b0b0b0;
    --g-login-shadow: 0 8px 32px rgba(38,38,51,0.24);
    --g-popup-bg: #ffffff;
    --g-popup-border: #e8e8e8;
    --g-sidebar-bg: #1e1e2e;
    --g-sidebar-text: #a4a4b1;
    --g-sidebar-active-bg: rgba(22,179,120,0.15);
    --g-sidebar-active-text: #16b378;
    --g-sidebar-hover-bg: rgba(255,255,255,0.05);
    --g-sidebar-width: 220px;
    --g-sidebar-collapsed-width: 56px;
  }

  /* ========== Dark Theme ========== */
  [data-theme="dark"] {
    --g-primary: #17b378;
    --g-primary-dark: #1da270;
    --g-primary-dim: #157a54;
    --g-primary-light: rgba(22,179,120,0.18);
    --g-primary-emphasis: #13d78d;
    --g-body: #efefef;
    --g-medium-text: #d5d5d5;
    --g-light-text: #a4a4b1;
    --g-bg: #32323f;
    --g-bg-secondary: #262633;
    --g-bg-tertiary: rgba(111,111,125,0.6);
    --g-border: #70707d;
    --g-border-light: #60606d;
    --g-error: #e63946;
    --g-warning: #dd962c;
    --g-info: #3b82f6;
    --g-selection: rgba(22,179,120,0.18);
    --g-overlay-bg: rgba(0,0,0,0.6);
    --g-map-marker: #17b378;
    --g-chart-axis: #d5d5d5;
    --g-chart-split: #60606d;
    --g-badge-a: #e63946;
    --g-badge-b: #dd962c;
    --g-badge-c: #3b82f6;
    --g-badge-active: #17b378;
    --g-badge-signed: #1da270;
    --g-badge-negotiating: #a4a4b1;
    --g-badge-ended: #70707d;
    --g-login-shadow: 0 8px 32px rgba(0,0,0,0.5);
    --g-popup-bg: #32323f;
    --g-popup-border: #60606d;
    --g-sidebar-bg: #1a1a28;
    --g-sidebar-text: #a4a4b1;
    --g-sidebar-active-bg: rgba(22,179,120,0.18);
    --g-sidebar-active-text: #17b378;
    --g-sidebar-hover-bg: rgba(255,255,255,0.05);
  }

  html { font-size: 14px; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Liberation Sans,Helvetica,Arial,sans-serif;
    background: var(--g-bg-secondary); color: var(--g-body); line-height: 1.5;
    transition: background .2s, color .2s;
    display: flex; min-height: 100vh;
  }

  /* ========== Sidebar ========== */
  .sidebar {
    width: var(--g-sidebar-width); min-height: 100vh; background: var(--g-sidebar-bg);
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: width .2s, background .2s; position: fixed; left: 0; top: 0; bottom: 0; z-index: 200;
  }
  .sidebar-brand {
    padding: 10px 10px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative; min-height: 48px;
  }
  .sidebar-brand .logo {
    width: 28px; height: 28px; border-radius: 3px; background: var(--g-primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 13px; flex-shrink: 0;
  }
  .sidebar-brand h1 { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; }
  .sidebar-toggle {
    margin-left: auto; width: 24px; height: 24px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.1); background: transparent; color: var(--g-sidebar-text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; transition: background .1s, color .1s, border-color .1s;
  }
  .sidebar-toggle:hover { background: var(--g-sidebar-hover-bg); color: #fff; border-color: rgba(255,255,255,0.18); }
  .sidebar-nav { flex: 1; padding: 4px 0; overflow-y: auto; }
  .sidebar-section { padding: 10px 12px 4px; font-size: 11px; color: var(--g-sidebar-text); text-transform: uppercase; letter-spacing: .5px; opacity: .5; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px; margin: 1px 6px;
    color: var(--g-sidebar-text); font-size: 13px; font-weight: 400;
    cursor: pointer; transition: background .1s, color .1s; text-decoration: none; border: none;
    background: none; width: calc(100% - 12px); text-align: left; font-family: inherit;
    border-radius: 3px; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--g-sidebar-hover-bg); color: #fff; }
  .nav-item.active { background: var(--g-sidebar-active-bg); color: var(--g-sidebar-active-text); border-left-color: var(--g-primary); }
  .nav-item .nav-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; flex-shrink: 0; opacity: .75; line-height: 1; }
  .nav-item.active .nav-icon { opacity: 1; }
  .sidebar-footer {
    padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-footer .avatar {
    width: 24px; height: 24px; border-radius: 3px; background: var(--g-primary);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .sidebar-footer .user-name { color: #fff; font-size: 13px; font-weight: 400; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-footer .btn-logout {
    padding: 2px 6px; border-radius: 3px; background: none; border: none;
    color: var(--g-sidebar-text); font-size: 11px; cursor: pointer; font-family: inherit;
    transition: color .1s;
  }
  .sidebar-footer .btn-logout:hover { color: var(--g-error); }

  /* ========== Main Area ========== */
  .main-area {
    flex: 1; margin-left: var(--g-sidebar-width); display: flex; flex-direction: column; min-height: 100vh;
    width: calc(100vw - var(--g-sidebar-width)); max-width: calc(100vw - var(--g-sidebar-width));
min-width: 0; overflow-x: clip; overflow-y: visible;
    transition: margin-left .2s, width .2s, max-width .2s;
  }
  body.sidebar-collapsed .sidebar { width: var(--g-sidebar-collapsed-width); }
  body.sidebar-collapsed .main-area {
    margin-left: var(--g-sidebar-collapsed-width);
    width: calc(100vw - var(--g-sidebar-collapsed-width));
    max-width: calc(100vw - var(--g-sidebar-collapsed-width));
  }
  body.sidebar-collapsed .sidebar-brand { justify-content: center; padding: 10px 8px; }
  body.sidebar-collapsed .sidebar-brand .logo { display: none; }
  body.sidebar-collapsed .sidebar-brand h1,
  body.sidebar-collapsed .sidebar-section,
  body.sidebar-collapsed .nav-label,
  body.sidebar-collapsed .sidebar-footer .user-name,
  body.sidebar-collapsed .sidebar-footer .btn-logout { display: none; }
  body.sidebar-collapsed .sidebar-toggle {
    position: static; margin-left: 0;
    background: var(--g-bg); color: var(--g-medium-text); border-color: var(--g-border-light);
    box-shadow: 0 1px 4px rgba(38,38,51,0.18);
  }
  body.sidebar-collapsed .sidebar-toggle:hover { color: var(--g-primary-dark); border-color: var(--g-primary); background: var(--g-bg); }
  body.sidebar-collapsed .nav-item { justify-content: center; padding: 9px 0; margin: 2px 6px; gap: 0; border-left-width: 0; width: calc(100% - 12px); }
  body.sidebar-collapsed .nav-item.active { border-left-width: 0; box-shadow: inset 3px 0 0 var(--g-primary); }
  body.sidebar-collapsed .sidebar-footer { justify-content: center; padding: 10px 8px; }
  body.sidebar-collapsed .sidebar-footer .avatar { width: 28px; height: 28px; }
  .btn-action {
    height: 28px; border-radius: 3px; border: 1px solid var(--g-border);
    background: var(--g-bg); color: var(--g-medium-text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 10px;
    font-size: 12px; font-weight: 500; font-family: inherit; transition: all .1s;
  }
  .btn-action:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .btn-action.primary { background: var(--g-primary); border-color: var(--g-primary); color: #fff; }
  .btn-action.primary:hover { background: var(--g-primary-dark); border-color: var(--g-primary-dark); color: #fff; }
  .btn-symbol {
    width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; flex-shrink: 0;
  }

  /* ---- Top Bar ---- */
  .topbar {
    height: 40px; background: var(--g-bg); border-bottom: 1px solid var(--g-border-light);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; position: sticky; top: 0; z-index: 9998;
    transition: background .2s, border-color .2s;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-title { font-size: 14px; font-weight: 600; color: var(--g-body); }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .btn-icon {
    width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--g-border);
    background: var(--g-bg); color: var(--g-medium-text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: all .1s;
  }
  .btn-icon:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }

  /* ---- Theme Switcher ---- */
  .theme-switcher { position: relative; display: inline-flex; }
  .theme-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--g-popup-bg); border: 1px solid var(--g-popup-border);
    border-radius: 3px; box-shadow: var(--g-login-shadow); min-width: 160px;
    z-index: 200; overflow: hidden;
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    cursor: pointer; font-size: 13px; color: var(--g-medium-text); transition: background .1s;
    border: none; background: none; width: 100%; text-align: left; font-family: inherit;
  }
  .theme-option:hover { background: var(--g-selection); }
  .theme-option.active { color: var(--g-primary-dark); font-weight: 600; }
  .theme-option .check { width: 16px; text-align: center; }

  /* ========== Content ========== */
  .content { flex: 1; padding: 20px 24px; position: relative; z-index: 0; }

  /* ---- Stats Cards ---- */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--g-bg); border-radius: 3px; padding: 14px 16px;
    border: 1px solid var(--g-border-light); transition: border-color .15s, background .2s;
  }
  .stat-card:hover { border-color: var(--g-primary); }
  .stat-card { position: relative; }
  .metric-close-btn {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
    border-radius: 3px; border: 1px solid var(--g-border); background: var(--g-bg);
    color: var(--g-light-text); cursor: pointer; display: none;
    align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .stat-card:hover .metric-close-btn { display: flex; }
  .metric-close-btn:hover { border-color: var(--g-error); color: var(--g-error); }
  .metric-add-btn {
    border: 2px dashed var(--g-border); border-radius: 3px; min-height: 80px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: border-color .15s, background .15s; background: transparent;
  }
  .metric-add-btn:hover { border-color: var(--g-primary); background: var(--g-primary-light); }
  .metric-add-inner { text-align: center; color: var(--g-light-text); }
  .metric-add-inner .plus { font-size: 24px; line-height: 1; }
  .metric-add-inner .text { font-size: 12px; margin-top: 2px; }
  .metric-edit-form { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .metric-edit-field label { display: block; font-size: 10px; color: var(--g-light-text); margin-bottom: 2px; font-weight: 500; }
  .metric-edit-field input, .metric-edit-field select { width: 100%; padding: 4px 6px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-body); font-size: 12px; font-family: inherit; }
  .metric-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .stat-card .label { font-size: 12px; color: var(--g-light-text); margin-bottom: 6px; font-weight: 500; }
  .stat-card .value { font-size: 1.7rem; font-weight: 700; color: var(--g-body); }
  .stat-card.accent { border-left: 3px solid var(--g-primary); }
  .stat-card.red    { border-left: 3px solid var(--g-error); }
  .stat-card.orange { border-left: 3px solid var(--g-warning); }
  .stat-card.blue   { border-left: 3px solid var(--g-info); }
  .stat-card.green  { border-left: 3px solid var(--g-primary); }
  .stat-card.gray   { border-left: 3px solid var(--g-light-text); }
  .metric-widget-value { padding: 18px 14px; font-size: 2rem; font-weight: 700; color: var(--g-body); }

  /* ---- Panels ---- */
  .panel {
    background: var(--g-bg); border-radius: 3px; margin-bottom: 12px;
    border: 1px solid var(--g-border-light); overflow: hidden; transition: background .2s, border-color .2s;
  }
  #mapPanel {
    position: relative;
    z-index: 0;
  }
  .panel-header {
    background: var(--g-bg); padding: 8px 14px; font-size: 13px; font-weight: 600;
    color: var(--g-medium-text); display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--g-border-light); transition: background .2s, border-color .2s;
  }
  .panel-body { padding: 14px; }

  /* ---- Map ---- */
  #map { height: 480px; width: 100%; margin-bottom: 12px; position: relative; z-index: 0; }
  #map.leaflet-container { overflow: hidden; }
  #map .leaflet-pane,
  #map .leaflet-tile,
  #map .leaflet-marker-icon,
  #map .leaflet-marker-shadow,
  #map .leaflet-tile-container,
  #map .leaflet-pane > svg,
  #map .leaflet-pane > canvas,
  #map .leaflet-zoom-box,
  #map .leaflet-image-layer,
  #map .leaflet-layer {
    position: absolute;
    left: 0;
    top: 0;
  }
  #map .leaflet-map-pane { z-index: 400; }
  #map .leaflet-tile-pane { z-index: 200; }
  #map .leaflet-overlay-pane { z-index: 400; }
  #map .leaflet-shadow-pane { z-index: 500; }
  #map .leaflet-marker-pane { z-index: 600; }
  #map .leaflet-tooltip-pane { z-index: 650; }
  #map .leaflet-popup-pane { z-index: 700; }
  #map .leaflet-top,
  #map .leaflet-bottom { position: absolute; z-index: 800; pointer-events: none; }
  #map .leaflet-top { top: 0; }
  #map .leaflet-right { right: 0; }
  #map .leaflet-bottom { bottom: 0; }
  #map .leaflet-left { left: 0; }
  #map .leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
  #map .leaflet-right .leaflet-control { float: right; }
  #map .leaflet-top .leaflet-control { margin-top: 10px; }
  #map .leaflet-bottom .leaflet-control { margin-bottom: 10px; }
  #map .leaflet-left .leaflet-control { margin-left: 10px; }
  #map .leaflet-right .leaflet-control { margin-right: 10px; }
  .map-controls { display: flex; align-items: center; gap: 6px; }
  .btn-fullscreen {
    background: var(--g-bg); border: 1px solid var(--g-border); color: var(--g-medium-text);
    padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  .btn-fullscreen:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }

  /* ---- Native Chart Widgets ---- */
  .dashboard-row { margin-bottom: 12px; }
  .chart-widgets-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chart-widget-card { border: 1px solid var(--g-border-light); border-radius: 3px; overflow: hidden; background: var(--g-bg); }
  .chart-widget-header { min-height: 38px; padding: 7px 10px; border-bottom: 1px solid var(--g-border-light); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chart-widget-title { font-size: 12px; font-weight: 600; color: var(--g-medium-text); }
  .chart-widget-scope { color: var(--g-light-text); font-size: 11px; font-weight: 400; margin-left: 6px; }
  .chart-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chart-action-btn { background: var(--g-bg); border: 1px solid var(--g-border); color: var(--g-medium-text); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .chart-action-btn:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .native-chart { width: 100%; height: 320px; }

  /* ---- Chart Edit Form ---- */
  .chart-edit-form { padding: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
  .chart-edit-field label { display: block; font-size: 11px; color: var(--g-light-text); margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: .3px; }
  .chart-edit-field select { width: 100%; padding: 6px 8px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-body); font-size: 13px; font-family: inherit; }
  .chart-edit-metric { display: flex; gap: 6px; }
  .chart-edit-metric select { flex: 1; min-width: 0; }
  .chart-edit-type-group { display: flex; gap: 4px; }
  .chart-type-btn { flex: 1; padding: 6px 4px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-medium-text); cursor: pointer; font-size: 12px; font-family: inherit; transition: all .1s; }
  .chart-type-btn:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .chart-type-btn.active { border-color: var(--g-primary); background: var(--g-primary-light); color: var(--g-primary-dark); font-weight: 600; }

  /* ---- Add Chart Placeholder ---- */
  .chart-add-btn { border: 2px dashed var(--g-border); border-radius: 3px; height: 120px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .15s, background .15s; background: transparent; }
  .chart-add-btn:hover { border-color: var(--g-primary); background: var(--g-primary-light); }
  .chart-add-inner { text-align: center; color: var(--g-light-text); }
  .chart-add-inner .plus { font-size: 28px; line-height: 1; }
  .chart-add-inner .text { font-size: 13px; margin-top: 4px; }

  /* ---- Map Fullscreen ---- */
  body.map-fullscreen-active {
    overflow: hidden;
  }
  body.map-fullscreen-active .sidebar,
  body.map-fullscreen-active .topbar {
    display: none;
  }
  body.map-fullscreen-active .main-area {
    margin-left: 0;
    width: 100vw;
    max-width: 100vw;
    min-height: 100vh;
    z-index: 10000;
  }
  body.map-fullscreen-active .content {
    padding: 0;
  }
  #mapPanel.map-fullscreen {
    position: fixed; inset: 0; z-index: 10000; border-radius: 0; border: none; margin: 0;
    display: flex; flex-direction: column; box-shadow: none;
  }
  #mapPanel.map-fullscreen .panel-header {
    flex: 0 0 auto; padding: 12px 16px; border-bottom: 1px solid var(--g-border);
  }
  #mapPanel.map-fullscreen #map {
    flex: 1 1 auto; min-height: 0; height: auto; margin-bottom: 0;
  }
  #mapPanel.map-collapsed #map {
    display: none;
  }

  /* ---- Overlays ---- */
  .login-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: var(--g-overlay-bg); justify-content: center; align-items: center;
    padding: 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .login-overlay.active { display: flex; }
  .login-box {
    background: var(--g-bg); border-radius: 6px; box-shadow: var(--g-login-shadow);
    width: 100%; max-width: 360px; overflow: hidden;

  .login-header {
    padding: 24px 24px 16px; text-align: center;

  .login-header h2 {

  .login-body { padding: 20px 24px; }
  .login-form { margin-top: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 500; color: var(--g-medium-text);
    margin-bottom: 6px;

  .form-group input {

  .btn-login:hover { background: var(--g-primary-dark); }

  body.login-active .sidebar,
  body.login-active .main-area { filter: blur(4px); pointer-events: none; user-select: none; transition: filter .3s; }
  .grist-overlay { display: none; position: fixed; inset: 0; z-index: 500; background: var(--g-bg); flex-direction: column; }
  .grist-overlay.active { display: flex; }
  body.grist-active .sidebar,
  body.grist-active .main-area { display: none; }
  .grist-overlay-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--g-border-light); background: var(--g-bg); }

  .grist-close-btn:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .grist-overlay iframe { flex: 1; width: 100%; border: none; }

  /* ---- Print ---- */
  @media print {
    .sidebar, .topbar, .btn-fullscreen, .footer, .grist-overlay { display: none !important; }
    .main-area { margin-left: 0; }
    .panel { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
    .stat-card { box-shadow: none; border: 1px solid #ddd; }

  /* ---- Responsive ---- */
  @media (max-width: 980px) {

  @media (max-width: 768px) {

    .sidebar .nav-item .nav-label,

    .sidebar-brand { justify-content: center; padding: 12px; }

    .stat-card .value { font-size: 1.3rem; }
    #map { height: 320px; }
    .content { padding: 12px; }

</style>

<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo">A9</div>
    <h1>A9 Marketing</h1>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">‹</button>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">主菜单</div>

<!-- Main Area -->

      <div class="theme-switcher">

    <!-- Map -->

</div>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-header">
      <div class="logo">A9</div>
      <h2>A9 Marketing System</h2>
    </div>
    <div class="login-body">
      <p style="text-align:center;color:var(--g-light-text);margin:0 0 14px;font-size:13px;">使用 Grist 账户登录</p>

<!-- Grist iframe overlay -->
<div class="grist-overlay" id="gristOverlay">
  <iframe id="gristFrame" src="about:blank" allow="clipboard-read; clipboard-write"></iframe>
</div>

<script>
(function() {
  'use strict';

  // HTML 转义函数，防止 XSS
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  let map, markersLayer, currentBasemapLayer, currentBasemapKey;
  let isFullscreen = false;
  let currentUser = null;
  const MAP_TILE_SIZE = 256;
  const MAP_WORLD_BOUNDS = [[-85.05112878, -180], [85.05112878, 180]];

  /* ============================================================
   *  Theme System — 与 Grist 双向联动
   *  亮色 ↔ Grist 浅色 | 暗色 ↔ Grist dark | 跟随系统 ↔ Grist 跟随系统
   *  持久化：a9-theme localStorage
   * ============================================================ */
  const THEME_KEY = 'a9-theme';           // localStorage: 前端模式
  let currentThemeMode = 'system';        // 'light' | 'dark' | 'system'

  // 检测系统是否偏好暗色
  function systemPrefersDark() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function resolveTheme(mode) {
    if (mode === 'system') return systemPrefersDark() ? 'dark' : 'light';
    return mode;
  }

  function applyTheme(resolvedTheme) {
    document.documentElement.setAttribute('data-theme', resolvedTheme);
    syncMapBasemapWithTheme(resolvedTheme);
  }

  // 设置主题模式（前端→Grist 联动入口）
  window.setTheme = function(mode) {
    currentThemeMode = mode;
    // 持久化到 localStorage
    localStorage.setItem(THEME_KEY, mode);
    const resolved = resolveTheme(mode);
    setThemeCookie(resolved);
    applyTheme(resolved);
    updateThemeUI(mode);
    closeThemeMenu();
    // 广播主题变化（其他标签页）
    try {
      const bc = new BroadcastChannel('grist-theme-channel');
      bc.postMessage({ type: 'theme-change', mode: mode });
      bc.close();
    } catch (_) {}
    // 同步主题到 Grist（用户主动切换，需重载 iframe）
    sendThemeToGrist(true);
  };

  function updateThemeUI(mode) {
    ['light', 'dark', 'system'].forEach(t => {
      const el = document.getElementById('check-' + t);
      if (el) el.textContent = (t === mode) ? '✓' : '';
    });
    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.theme === mode);
    });
  }

  window.toggleThemeMenu = function() {
    const dd = document.getElementById('themeDropdown');
    if (dd) dd.classList.toggle('open');
  };

  function closeThemeMenu() {
    const dd = document.getElementById('themeDropdown');
    if (dd) dd.classList.remove('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.theme-switcher')) closeThemeMenu();
  });

  // 同步模式到前端（Grist→前端 联动入口）
  function syncModeFromGrist(mode) {
    if (!mode || !['light', 'dark', 'system'].includes(mode) || mode === currentThemeMode) return;
    currentThemeMode = mode;
    // 持久化
    localStorage.setItem(THEME_KEY, mode);
    applyTheme(resolveTheme(mode));
    updateThemeUI(mode);
  }

  function getThemeCookie() {
    const match = document.cookie.match(/(?:^|;\s*)a9-theme-sync=([^;]*)/);
    return match ? match[1] : null;
  }

  function setThemeCookie(theme) {
    document.cookie = 'a9-theme-sync=' + theme + ';path=/;max-age=' + (365 * 24 * 60 * 60) + ';SameSite=Lax';
  }

  // 初始化主题（从 localStorage 恢复，确保刷新后不变）
  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved && ['light', 'dark', 'system'].includes(saved)) {
      currentThemeMode = saved;
    } else {
      const cookieTheme = getThemeCookie();
      if (cookieTheme === 'dark' || cookieTheme === 'light') {
        currentThemeMode = cookieTheme;
      }
    }
    applyTheme(resolveTheme(currentThemeMode));
    updateThemeUI(currentThemeMode);
    localStorage.setItem(THEME_KEY, currentThemeMode);

    // 监听系统主题变化（跟随系统模式下实时响应）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (currentThemeMode === 'system') {
        applyTheme(resolveTheme('system'));
        sendThemeToGrist(true);
      }
    });

    // 监听 localStorage 变化（其他标签页写入时触发 storage 事件）
    window.addEventListener('storage', function(e) {
      if (e.key === THEME_KEY && e.newValue) {
        const mode = e.newValue;
        if (mode && ['light', 'dark', 'system'].includes(mode)) {
          syncModeFromGrist(mode);
        }
      }
    });

    // 监听 BroadcastChannel（其他标签页发送）
    try {
      const bc = new BroadcastChannel('grist-theme-channel');
      bc.onmessage = function(e) {
        if (e.data && e.data.type === 'theme-change' && e.data.mode) {
          syncModeFromGrist(e.data.mode);
        }
      };
    } catch (_) {}

    let _lastCookieTheme = getThemeCookie();
    setInterval(function() {
      const current = getThemeCookie();
      if (current && current !== _lastCookieTheme) {
        _lastCookieTheme = current;
        if (current === 'dark' || current === 'light') {
          currentThemeMode = current;
          localStorage.setItem(THEME_KEY, current);
          applyTheme(current);
          updateThemeUI(current);
        }
      }
    }, 1000);
  }

  initTheme();

  /* ============================================================
   *  Grist iframe 管理
   * ============================================================ */
  // 使用代理路径（同源），注入的主题同步脚本可通过 postMessage 通信
  const GRIST_PROXY_PATH = '/grist/';
  let gristIframeReady = false;

  async function getGristOpenPath() {
    try {
      const res = await fetch('/api/health');
      if (!res.ok) return GRIST_PROXY_PATH;
      const health = await res.json();
      if (health.gristDashboardPath) {
        return health.gristDashboardPath;
      }
      if (health.gristDoc && health.gristDoc !== '(未配置)') {
        return '/grist/doc/' + encodeURIComponent(health.gristDoc);
      }
    } catch (_) {}
    return GRIST_PROXY_PATH;
  }

  let dashboardWidgets = [];
  let chartSchema = null;
  const chartInstances = new Map();
  const LEAFLET_FALLBACK_URL = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';

  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      const script = document.createElement('script');
      script.src = src;
      script.crossOrigin = 'anonymous';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function ensureLeafletLoaded() {
    if (window.L) return true;
    try {
      await loadScript(LEAFLET_FALLBACK_URL);
    } catch (_) {}
    return Boolean(window.L);
  }

  async function loadChartSchema() {
    if (chartSchema) return chartSchema;
    const res = await fetch('/api/chart-schema', { cache: 'no-store' });
    if (!res.ok) return { tables: [] };
    chartSchema = await res.json();
    return chartSchema;
  }

  async function loadDashboardWidgets() {
    try {
      await loadChartSchema();
      const res = await fetch('/api/dashboard-widgets', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      dashboardWidgets = data.widgets || [];
      await renderDashboardWidgets();
    } catch (_) {}
  }

  async function saveUserDashboardWidgets() {
    await fetch('/api/dashboard-widgets', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ widgets: dashboardWidgets.filter(widget => widget.scope === 'user') }),
    });
  }

  async function renderDashboardWidgets() {
    const metricGrid = document.getElementById('metricWidgetsGrid');
    const chartGrid = document.getElementById('chartWidgetsGrid');
    if (!metricGrid || !chartGrid) return;
    metricGrid.innerHTML = '';
    chartGrid.innerHTML = '';
    chartInstances.clear();
    for (const widget of dashboardWidgets) {
      if (widget.type === 'metric') {
        metricGrid.insertAdjacentHTML('beforeend', renderMetricShell(widget));
      } else {
        chartGrid.insertAdjacentHTML('beforeend', renderChartShell(widget));
      }
      await renderNativeChartWidget(widget);
    }
    metricGrid.insertAdjacentHTML('beforeend', '<div class="metric-add-btn" onclick="addNewMetric()"><div class="metric-add-inner"><div class="plus">+</div><div class="text">添加统计</div></div></div>');
    chartGrid.insertAdjacentHTML('beforeend', '<div class="chart-add-btn" onclick="addNewChart()"><div class="chart-add-inner"><div class="plus">+</div><div class="text">添加新图表</div></div></div>');
  }

  function renderMetricShell(widget) {
    return '<div class="stat-card accent" data-widget-id="' + escapeHtml(widget.id) + '">' +
      '<button class="metric-close-btn" onclick="closeMetricWidget(this)" title="关闭">✕</button>' +
      '<div class="label">' + escapeHtml(widget.title) + '</div>' +
      '<div class="value metric-widget-value" id="widget-' + escapeHtml(widget.id) + '">-</div>' +
    '</div>';
  }

  function renderChartShell(widget) {
    return '<div class="chart-widget-card" data-widget-id="' + escapeHtml(widget.id) + '">' +
      '<div class="chart-widget-header">' +
        '<div class="chart-widget-title">' + escapeHtml(widget.title) + '</div>' +
        '<div class="chart-actions">' +
          '<button class="chart-action-btn chart-view-btn" onclick="refreshGristWidget(this)">刷新</button>' +
          '<button class="chart-action-btn chart-view-btn" onclick="editGristWidget(this)">编辑</button>' +
          '<button class="chart-action-btn chart-edit-btn" onclick="saveGristWidget(this)" style="display:none">保存</button>' +
          '<button class="chart-action-btn chart-edit-btn" onclick="cancelEditGristWidget(this)" style="display:none">取消</button>' +
          '<button class="chart-action-btn" onclick="closeGristWidget(this)">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="native-chart" id="widget-' + escapeHtml(widget.id) + '" style="height:' + (parseInt(widget.height, 10) || 320) + 'px"></div>' +
    '</div>';
  }

  async function renderNativeChartWidget(widget) {
    const el = document.getElementById('widget-' + widget.id);
    if (!el) return;
    const res = await fetch('/api/chart-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(widget),
    });
    if (!res.ok) return;
    const data = await res.json();
    if (data.type === 'metric') {
      el.textContent = data.value != null ? Number(data.value).toLocaleString() : '-';
      return;
    }
    const instance = echarts.init(el);
    chartInstances.set(widget.id, instance);
    instance.setOption(buildChartOption(data), true);
  }

  function buildChartOption(data) {
    const cs = getComputedStyle(document.documentElement);
    if (data.type === 'pie') {
      return {
        tooltip: { trigger: 'item' },
        series: [{ type: 'pie', radius: ['40%', '70%'], data: data.labels.map((label, i) => ({ name: label, value: data.values[i] })) }],
      };
    }
    return {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 48, right: 16, bottom: 48, top: 24 },
      xAxis: { type: 'category', data: data.labels, axisLabel: { color: cs.getPropertyValue('--g-chart-axis').trim(), rotate: data.labels.length > 8 ? 30 : 0 } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: cs.getPropertyValue('--g-chart-split').trim() } } },
      series: [{ type: data.type === 'line' ? 'line' : 'bar', data: data.values, itemStyle: { color: cs.getPropertyValue('--g-primary').trim() } }],
    };
  }

  window.refreshGristWidget = function(button) {
    const card = button.closest('.chart-widget-card');
    const widget = dashboardWidgets.find(item => item.id === card?.dataset.widgetId);
    if (widget) renderNativeChartWidget(widget);
  };

  window.deleteGristWidget = async function(button) {
    const card = button.closest('.chart-widget-card');
    if (!card) return;
    dashboardWidgets = dashboardWidgets.filter(widget => widget.id !== card.dataset.widgetId || widget.scope !== 'user');
    await renderDashboardWidgets();
    await saveUserDashboardWidgets();
  };

  function getTableSchema(tableId) {
    if (!chartSchema || !chartSchema.tables) return null;
    return chartSchema.tables.find(function(t) { return t.id === tableId; });
  }

  function buildChartEditFormHTML(widget) {
    var tables = (chartSchema && chartSchema.tables) || [];
    var tableOptions = tables.map(function(t) {
      var selected = t.id === widget.tableId ? ' selected' : '';
      return '<option value="' + escapeHtml(t.id) + '"' + selected + '>' + escapeHtml(t.id) + '</option>';
    }).join('');
    var tableSchema = getTableSchema(widget.tableId);
    var fields = (tableSchema && tableSchema.fields) || [];
    var dimensionOptions = fields.map(function(f) {
      var selected = f.id === widget.dimension ? ' selected' : '';
      return '<option value="' + escapeHtml(f.id) + '"' + selected + '>' + escapeHtml(f.label || f.id) + '</option>';
    }).join('');
    var metricTypeOptions = ['count', 'sum', 'avg'].map(function(t) {
      var selected = t === widget.metric.type ? ' selected' : '';
      var label = t === 'count' ? '计数' : t === 'sum' ? '求和' : '平均值';
      return '<option value="' + t + '"' + selected + '>' + label + '</option>';
    }).join('');
    var metricFieldOptions = fields.map(function(f) {
      var selected = f.id === widget.metric.field ? ' selected' : '';
      return '<option value="' + escapeHtml(f.id) + '"' + selected + '>' + escapeHtml(f.label || f.id) + '</option>';
    }).join('');
    var metricFieldDisabled = widget.metric.type === 'count' ? ' disabled' : '';
    var types = [
      { key: 'bar', label: '柱状图' },
      { key: 'pie', label: '饼图' },
      { key: 'line', label: '折线图' }
    ];
    var typeButtons = types.map(function(t) {
      var cls = t.key === widget.type ? ' active' : '';
      return '<button type="button" class="chart-type-btn' + cls + '" data-type="' + t.key + '" onclick="selectChartType(this)">' + t.label + '</button>';
    }).join('');
    return '<div class="chart-edit-form">' +
      '<div class="chart-edit-field">' +
        '<label>数据表</label>' +
        '<select class="edit-table-id" onchange="changeEditTable(this)">' + tableOptions + '</select>' +
      '</div>' +
      '<div class="chart-edit-field">' +

  // 监听 Grist iframe 的 postMessage（主题变更通知）
  window.addEventListener('message', function(e) {
    if (e.origin !== window.location.origin) return;
    if (!e.data) return;
    // Grist iframe 就绪
    if (e.data.type === 'grist-iframe-ready') {
      gristIframeReady = true;
      // iframe 就绪后仅同步主题偏好到后端，不重载 iframe
      sendThemeToGrist(false);
    }
    // Grist 主题变更 → 同步到前端
    if (e.data.type === 'grist-theme-changed') {
      var mode = null;
      if (e.data.syncWithOS) mode = 'system';
      else if (e.data.appearance === 'dark') mode = 'dark';
      else if (e.data.appearance === 'light') mode = 'light';
      if (mode) syncModeFromGrist(mode);
    }
  });

  // 向 Grist 同步主题
  // reloadIframe: true = 用户主动切换主题，需要重载 iframe 使 Grist 生效
  function sendThemeToGrist(reloadIframe) {
    var resolved = resolveTheme(currentThemeMode);
    var appearance = resolved === 'dark' ? 'dark' : 'light';
    var syncWithOS = currentThemeMode === 'system';
    var frame = document.getElementById('gristFrame');
    var overlay = document.getElementById('gristOverlay');
    var gristIsOpen = overlay && overlay.classList.contains('active');

    fetch('/api/grist-theme', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ appearance: appearance, syncWithOS: syncWithOS }),
    }).then(function(res) {
      if (res.ok && reloadIframe && gristIsOpen && frame) {
        frame.src = frame.src;
      }
    }).catch(function(err) {
      console.warn('[Theme] Grist 主题同步失败:', err.message);
    });
  }

  // ESC 键关闭 Grist iframe
  document.addEventListener('keydown', function(e) {

  function getMapCoveringMinZoom() {
    const mapEl = document.getElementById('map');
    const width = mapEl ? mapEl.clientWidth : 0;
    const height = mapEl ? mapEl.clientHeight : 0;
    if (!width || !height) return 0;
    return Math.max(0, Math.ceil(Math.log2(Math.max(width, height) / MAP_TILE_SIZE)));
  }

  function applyMapCoverageBounds() {
    if (!map) return;
    const minZoom = getMapCoveringMinZoom();
    map.setMinZoom(minZoom);
    map.setMaxBounds(MAP_WORLD_BOUNDS);
    if (map.getZoom() < minZoom) map.setZoom(minZoom, { animate: false });
    map.panInsideBounds(MAP_WORLD_BOUNDS, { animate: false });
  }

  function refreshDashboardLayout() {
    const refresh = () => {
      if (!map) return;
      map.invalidateSize({ pan: false });
      applyMapCoverageBounds();
    };
    requestAnimationFrame(refresh);
    setTimeout(refresh, 250);
  }

  const basemaps = {
    positron: () => L.tileLayer('/api/map-tiles/light/{z}/{x}/{y}.png', {
      attribution: '&copy; CartoDB', maxZoom: 18, noWrap: true, bounds: MAP_WORLD_BOUNDS
    }),
    dark: () => L.tileLayer('/api/map-tiles/dark/{z}/{x}/{y}.png', {
      attribution: '&copy; CartoDB', maxZoom: 18, noWrap: true, bounds: MAP_WORLD_BOUNDS
    })
  };

  function syncMapBasemapWithTheme(resolvedTheme) {
    if (!map) return;
    const nextKey = resolvedTheme === 'dark' ? 'dark' : 'positron';
    if (currentBasemapKey === nextKey) return;
    if (currentBasemapLayer) map.removeLayer(currentBasemapLayer);
    currentBasemapLayer = basemaps[nextKey]();
    currentBasemapLayer.addTo(map);
    currentBasemapKey = nextKey;
  }

  function initMap() {
    if (!window.L) return false;
    if (map) {
      setTimeout(refreshDashboardLayout, 0);
      return true;
    }
    map = L.map('map', {
      center: [35.8, 104.5],
      zoom: 4,
      zoomControl: false,
      maxBounds: MAP_WORLD_BOUNDS,
      maxBoundsViscosity: 1.0
    });
    syncMapBasemapWithTheme(resolveTheme(currentThemeMode));
    markersLayer = L.featureGroup().addTo(map);
    applyMapCoverageBounds();
    return true;
  }

  function updateMap(byRegion) {
    if (!markersLayer) return;
    markersLayer.clearLayers();
    if (!byRegion || !byRegion.length) return;
    byRegion.forEach(r => {
      if (r.coord_lat == null || r.coord_lng == null) return;
      const radius = Math.max(8, Math.min(40, Math.sqrt(r.total) * 6));
      const marker = L.circleMarker([r.coord_lat, r.coord_lng], {
        radius: radius,
        fillColor: r.color || getComputedStyle(document.documentElement).getPropertyValue('--g-map-marker').trim(),
        color: '#fff', weight: 2, opacity: 0.9, fillOpacity: 0.7
      });
      marker.bindPopup(
        '<div style="min-width:160px;font-size:13px;">' +
        '<strong style="font-size:14px;">' + escapeHtml(r.title || r.label) + '</strong><br/>' +
        '客户总数：<b>' + escapeHtml(r.total) + '</b><br/>' +
        'A级：' + escapeHtml(r.ratingA) + ' &nbsp; B级：' + escapeHtml(r.ratingB) + ' &nbsp; C级：' + escapeHtml(r.ratingC) + '<br/>' +
        '预计贡献：<b>' + escapeHtml(r.estimate) + '</b> 万元' +
        '</div>'
      );
      markersLayer.addLayer(marker);
    });
    const bounds = markersLayer.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 6 });
      applyMapCoverageBounds();
    }
  }

      document.getElementById('footerInfo').textContent = '数据生成于：' + genTime + ' ｜ 数据来源：Grist';
    } catch (err) {

      const msg = err.message || '';
      let hint = msg;
      if (msg.includes('GRIST_DOC_ID')) hint = '请先配置 GRIST_DOC_ID 环境变量。';
      else if (msg.includes('Customers') || msg.includes('表不存在')) hint = '请在 Grist 文档中创建 Customers 表。';

  function updateUserUI(user) {
    const footer = document.getElementById('sidebarFooter');
    const avatar = document.getElementById('sidebarAvatar');
    const name = document.getElementById('sidebarUserName');
    if (footer && user) {
      footer.style.display = 'flex';
      if (avatar) avatar.textContent = (user.displayName || user.email || 'U').charAt(0).toUpperCase();
      if (name) name.textContent = user.displayName || user.email || '';
    }

  window.doLogin = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    if (!email) { errorEl.textContent = '请输入邮箱'; return; }
    btn.disabled = true;
    btn.textContent = '登录中...';
    errorEl.textContent = '';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || '登录失败';
        btn.disabled = false;
        btn.textContent = '登 录';
        return;
      }
      currentUser = data.user;
      hideLogin();
      onLoginSuccess();
    } catch (e) {
      errorEl.textContent = '网络连接失败，请检查服务器';
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  };


  async function checkAuth() {
    try {
      const res = await fetch('/api/auth/me');
      if (res.ok) {
        const data = await res.json();
        if (data.authenticated) {
          currentUser = data.user;
          updateUserUI(data.user);
          return true;
        }
      }
      // 不再自动从 Grist 会话同步认证信息，必须通过 A9 登录
    } catch (e) {}
    return false;
  }

      const res = await fetch('/api/auth/logout', { method: 'POST' });
      if (res.ok) {
        currentUser = null;
        const footer = document.getElementById('sidebarFooter');
        if (footer) footer.style.display = 'none';
        showLogin();
      } else {
        console.error('登出失败');
      }
    } catch (e) {
      console.error('登出请求失败', e);
    }
  };

  document.addEventListener('DOMContentLoaded', async function() {
    // 如果在 iframe 中加载，不初始化（防止 Grist 代理回退时递归嵌套）
    if (window.self !== window.top) return;

    initSidebar();
    const authed = await checkAuth();
    if (authed) {
      onLoginSuccess();
    } else {
      showLogin();
    }
  });

})();
</script>
</body>
</html>
