</div>

<!-- Login Overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-header">
      <div class="logo">A9</div>
      <h2>A9 Marketing System</h2>
    </div>
    <div class="login-body">
      <p style="text-align:center;color:var(--g-light-text);margin:0 0 14px;font-size:13px;">使用 Grist 账户登录</p>
      <div class="login-form">
        <div class="form-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" placeholder="请输入 Grist 注册邮箱" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="如账户设置了密码，请输入密码" autocomplete="current-password">
        </div>
        <div class="login-error" id="loginError"></div>
      </div>
    </div>
    <div class="login-footer">
      <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // HTML 转义函数，防止 XSS
  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // 安全写入 localStorage：隐私模式/配额满时静默降级，不抛错中断业务逻辑
  function safeLocalStorage(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      // localStorage 不可用，忽略
    }
  }

  let map, markersLayer, currentBasemapLayer, currentBasemapKey;
  let _lastByRegion = [];  // 缓存最近一次 stats 数据，map 重建后用其恢复 markers
  let currentUser = null;
  let dashboardWidgets = [];
  let chartSchema = null;
  const chartInstances = new Map();
  const CHART_THEME_PALETTES = {
    light: {
      colors: ['#16b378', '#3b82f6', '#8b5cf6', '#f59e0b', '#06b6d4', '#ef4444', '#84cc16'],
      barStart: '#36d399',
      barEnd: '#0f9f6e',
      lineAreaStart: 'rgba(59,130,246,0.22)',
      lineAreaEnd: 'rgba(59,130,246,0.02)',
      tooltipBg: 'rgba(255,255,255,0.96)',
      tooltipBorder: '#d9d9d9',
      tooltipText: '#262633',
      pieBorder: '#ffffff'
    },
    dark: {
      colors: ['#2dd4bf', '#60a5fa', '#a78bfa', '#fbbf24', '#38bdf8', '#fb7185', '#a3e635'],
      barStart: '#5eead4',
      barEnd: '#14b8a6',
      lineAreaStart: 'rgba(96,165,250,0.26)',
      lineAreaEnd: 'rgba(96,165,250,0.03)',
      tooltipBg: 'rgba(38,38,51,0.96)',
      tooltipBorder: '#60606d',
      tooltipText: '#efefef',
      pieBorder: '#32323f'
    }
  };
  const MAP_TILE_SIZE = 256;
  const MAP_WORLD_BOUNDS = [[-85.05112878, -180], [85.05112878, 180]];

  /* ============================================================
   *  Theme System — 与 Grist 双向联动
   *  亮色 ↔ Grist 浅色 | 暗色 ↔ Grist dark | 跟随系统 ↔ Grist 跟随系统
   *  持久化：a9-theme localStorage
   * ============================================================ */
  const THEME_KEY = 'a9-theme';           // localStorage: 前端模式
  let currentThemeMode = 'system';        // 'light' | 'dark' | 'system'

  // 检测系统是否偏好暗色
  function systemPrefersDark() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function resolveTheme(mode) {
    if (mode === 'system') return systemPrefersDark() ? 'dark' : 'light';
    return mode;
  }

  function applyTheme(resolvedTheme) {
    document.documentElement.setAttribute('data-theme', resolvedTheme);
    syncMapBasemapWithTheme(resolvedTheme);
    rerenderNativeChartsForTheme();
  }

  // 设置主题模式（前端→Grist 联动入口）
  window.setTheme = function(mode) {
    currentThemeMode = mode;
    // 持久化到 localStorage
    safeLocalStorage(THEME_KEY, mode);
    const resolved = resolveTheme(mode);
    setThemeCookie(resolved);
    applyTheme(resolved);
    updateThemeUI(mode);
    closeThemeMenu();
    // 广播主题变化（其他标签页）
    try {
      const bc = new BroadcastChannel('grist-theme-channel');
      bc.postMessage({ type: 'theme-change', mode: mode });
      bc.close();
    } catch (_) {}
    // 同步主题到 Grist（Grist 独立标签页，仅写后端偏好）
    sendThemeToGrist();
  };

  function updateThemeUI(mode) {
    ['light', 'dark', 'system'].forEach(t => {
      const el = document.getElementById('check-' + t);
      if (el) el.textContent = (t === mode) ? '✓' : '';
    });
    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.theme === mode);
    });
  }

  window.toggleThemeMenu = function() {
    const dd = document.getElementById('themeDropdown');
    if (dd) dd.classList.toggle('open');
  };

  function closeThemeMenu() {
    const dd = document.getElementById('themeDropdown');
    if (dd) dd.classList.remove('open');
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.theme-switcher')) closeThemeMenu();
    if (!e.target.closest('.add-widget-switcher')) closeAddWidgetMenu();
  });

  // 同步模式到前端（Grist→前端 联动入口）
  function syncModeFromGrist(mode) {
    if (!mode || !['light', 'dark', 'system'].includes(mode) || mode === currentThemeMode) return;
    currentThemeMode = mode;
    // 持久化
    safeLocalStorage(THEME_KEY, mode);
    applyTheme(resolveTheme(mode));
    updateThemeUI(mode);
  }

  function getThemeCookie() {
    const match = document.cookie.match(/(?:^|;\s*)a9-theme-sync=([^;]*)/);
    return match ? match[1] : null;
  }

  function setThemeCookie(theme) {
    document.cookie = 'a9-theme-sync=' + theme + ';path=/;max-age=' + (365 * 24 * 60 * 60) + ';SameSite=Lax';
  }

  // 初始化主题（从 localStorage 恢复，确保刷新后不变）
  function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved && ['light', 'dark', 'system'].includes(saved)) {
      currentThemeMode = saved;
    } else {
      const cookieTheme = getThemeCookie();
      if (cookieTheme === 'dark' || cookieTheme === 'light') {
        currentThemeMode = cookieTheme;
      }
    }
    applyTheme(resolveTheme(currentThemeMode));
    updateThemeUI(currentThemeMode);
    safeLocalStorage(THEME_KEY, currentThemeMode);

    // 监听系统主题变化（跟随系统模式下实时响应）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      if (currentThemeMode === 'system') {
        applyTheme(resolveTheme('system'));
        sendThemeToGrist();
      }
    });

    // 监听 localStorage 变化（其他标签页写入时触发 storage 事件）
    window.addEventListener('storage', function(e) {
      if (e.key === THEME_KEY && e.newValue) {
        const mode = e.newValue;
        if (mode && ['light', 'dark', 'system'].includes(mode)) {
          syncModeFromGrist(mode);
        }
      }
    });

    // 监听 BroadcastChannel（其他标签页发送）
    try {
      const bc = new BroadcastChannel('grist-theme-channel');
      bc.onmessage = function(e) {
        if (e.data && e.data.type === 'theme-change' && e.data.mode) {
          syncModeFromGrist(e.data.mode);
        }
      };
    } catch (_) {}

    let _lastCookieTheme = getThemeCookie();
    setInterval(function() {
      const current = getThemeCookie();
      if (current && current !== _lastCookieTheme) {
        _lastCookieTheme = current;
        if (current === 'dark' || current === 'light') {
          currentThemeMode = current;
          safeLocalStorage(THEME_KEY, current);
          applyTheme(current);
          updateThemeUI(current);
        }
      }
    }, 1000);
  }

  initTheme();

  /* ============================================================
   *  Grist 入口（新标签页打开，独立于门户）
   * ============================================================ */
  // Grist 外部地址：与门户同机部署时默认 8484，服务器部署时通过此变量切换
  const GRIST_URL = window.GRIST_URL || (location.protocol + '//' + location.hostname + ':8484');
  let gristIframeReady = false;

  async function getGristOpenPath() {
    return GRIST_URL;
  }

  const LEAFLET_FALLBACK_URL = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';

  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      const script = document.createElement('script');
      script.src = src;
      script.crossOrigin = 'anonymous';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async function ensureLeafletLoaded() {
    if (window.L) return true;
    try {
      await loadScript(LEAFLET_FALLBACK_URL);
    } catch (_) {}
    return Boolean(window.L);
  }

  async function loadChartSchema() {
    if (chartSchema) return chartSchema;
    const res = await fetch('/api/chart-schema', { cache: 'no-store' });
    if (!res.ok) return { tables: [] };
    chartSchema = await res.json();
    return chartSchema;
  }

  async function loadDashboardWidgets() {
    try {
      await loadChartSchema();
      const res = await fetch('/api/dashboard-widgets', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      dashboardWidgets = data.widgets || [];
      // 注入地图 widget（首次使用时；scope='user' 会随布局一起保存到账户）
      if (!dashboardWidgets.find(function(w) { return w.id === 'map-widget'; })) {
        dashboardWidgets.unshift({
          id: 'map-widget',
          title: '客户地域分布',
          type: 'map',
          x: 0, y: 0, w: 12, h: 6,
          scope: 'user',
        });
      }
      await renderDashboardWidgets();
    } catch (_) {}
  }

  const GRID_WIDGET_MIN_W = 1;
  const GRID_WIDGET_MIN_H = 1;

  function gridUnit(value, fallback, minimum) {
    var parsed = parseInt(value, 10);
    if (!Number.isFinite(parsed)) parsed = parseInt(fallback, 10);
    if (!Number.isFinite(parsed)) parsed = minimum;
    return Math.max(minimum, parsed);
  }

  function widgetConstraintOptions() {
    return {
      minW: GRID_WIDGET_MIN_W,
      minH: GRID_WIDGET_MIN_H,
      maxW: 12,
      maxH: 12,
    };
  }

  function applyWidgetNodeConstraints(node, el) {
    if (!node) return;
    var constraints = widgetConstraintOptions();
    node.minW = constraints.minW;
    node.minH = constraints.minH;
    node.maxW = constraints.maxW;
    node.maxH = constraints.maxH;
    var itemEl = el || node.el;
    if (itemEl) {
      itemEl.setAttribute('gs-min-w', String(constraints.minW));
      itemEl.setAttribute('gs-min-h', String(constraints.minH));
      itemEl.setAttribute('gs-max-w', String(constraints.maxW));
      itemEl.setAttribute('gs-max-h', String(constraints.maxH));
    }
  }

  function gridUnitsFromElementRect(el) {
    var gridEl = document.getElementById('widgetGrid');
    if (!gridEl || !el) return null;
    var gridRect = gridEl.getBoundingClientRect();
    var rect = el.getBoundingClientRect();
    var columns = widgetGrid && widgetGrid.getColumn ? widgetGrid.getColumn() : 12;
    var cellHeight = widgetGrid && widgetGrid.opts ? parseFloat(widgetGrid.opts.cellHeight) : 70;
    if (!Number.isFinite(cellHeight)) {
      cellHeight = parseFloat(getComputedStyle(gridEl).getPropertyValue('--gs-cell-height')) || 70;
    }
    var colWidth = gridRect.width / columns;
    if (!(rect.width > 0 && rect.height > 0 && colWidth > 0 && cellHeight > 0)) return null;
    return {
      x: Math.max(0, Math.round((rect.left - gridRect.left) / colWidth)),
      y: Math.max(0, Math.round((rect.top - gridRect.top) / cellHeight)),
      w: Math.max(GRID_WIDGET_MIN_W, Math.min(12, Math.round(rect.width / colWidth))),
      h: Math.max(GRID_WIDGET_MIN_H, Math.min(12, Math.round(rect.height / cellHeight))),
    };
  }

  function getWidgetLayoutFromElement(el) {
    if (!el) return null;
    var node = el.gridstackNode || (widgetGrid && widgetGrid.getNodeByEl && widgetGrid.getNodeByEl(el));
    if (node) applyWidgetNodeConstraints(node, el);
    var id = (node && node.id) || el.getAttribute('gs-id');
    if (!id) return null;
    var rectLayout = gridUnitsFromElementRect(el);
    return {
      id: id,
      node: node,
      x: rectLayout ? rectLayout.x : gridUnit(el.getAttribute('gs-x'), node && node.x, 0),
      y: rectLayout ? rectLayout.y : gridUnit(el.getAttribute('gs-y'), node && node.y, 0),
      // GridStack 不写 gs-w/gs-h 时代表 1；这里必须把缺省当作 1，而不是回退到旧 widget.w。
      // 拖到 1 格时 node 可能还保留拖动前尺寸，所以保存时 DOM 布局属性优先。
      w: rectLayout ? rectLayout.w : gridUnit(el.getAttribute('gs-w') || 1, node && node.w, GRID_WIDGET_MIN_W),
      h: rectLayout ? rectLayout.h : gridUnit(el.getAttribute('gs-h') || 1, node && node.h, GRID_WIDGET_MIN_H),
    };
  }

  function refreshWidgetResizeConstraints(el) {
    if (!widgetGrid || !el) return;
    var node = el.gridstackNode || widgetGrid.getNodeByEl(el);
    if (!node) return;
    applyWidgetNodeConstraints(node, el);
    widgetGrid.update(el, widgetConstraintOptions());
  }

  function refreshAllWidgetResizeConstraints() {
    if (!widgetGrid) return;
    widgetGrid.getGridItems().forEach(refreshWidgetResizeConstraints);
  }

  function syncWidgetLayoutFromNode(node, options) {
    if (!node || !node.id) return null;
    applyWidgetNodeConstraints(node);
    var widget = dashboardWidgets.find(function(w) { return w.id === node.id; });
    if (!widget) return null;
    widget.x = gridUnit(node.x, widget.x, 0);
    widget.y = gridUnit(node.y, widget.y, 0);
    if (!options || options.size !== false) {
      widget.w = gridUnit(node.w, widget.w, GRID_WIDGET_MIN_W);
      widget.h = gridUnit(node.h, widget.h, GRID_WIDGET_MIN_H);
    }
    return widget;
  }

  function syncWidgetLayoutFromElement(el, options) {
    var layout = getWidgetLayoutFromElement(el);
    if (!layout) return null;
    var widget = dashboardWidgets.find(function(w) { return w.id === layout.id; });
    if (!widget) return null;
    widget.x = layout.x;
    widget.y = layout.y;
    if (!options || options.size !== false) {
      widget.w = layout.w;
      widget.h = layout.h;
    }
    return widget;
  }

  async function saveUserDashboardWidgets() {
    try {
      if (!widgetGrid) return;
      var payload = [];
      widgetGrid.getGridItems().forEach(function(el) {
        var widget = syncWidgetLayoutFromElement(el);
        if (!widget) return;
        var copy = {};
        for (var k in widget) { if (widget.hasOwnProperty(k)) copy[k] = widget[k]; }
        payload.push(copy);
      });
      payload = payload.filter(function(w) { return w.scope === 'user'; });
      var savedSignature = getCurrentLayoutSignature();
      const res = await fetch('/api/dashboard-widgets', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ widgets: payload }),
      });
      if (!res.ok) {
        var footer = document.getElementById('footerInfo');
        if (footer) footer.textContent = '布局保存失败（HTTP ' + res.status + '）';
      } else {
        var currentSignature = getCurrentLayoutSignature();
        if (currentSignature && savedSignature && currentSignature !== savedSignature) {
          lastLayoutSignature = currentSignature;
          scheduleSaveLayout(80);
        } else {
          lastLayoutSignature = currentSignature || savedSignature;
        }
      }
    } catch (e) {
      var footer = document.getElementById('footerInfo');
      if (footer) footer.textContent = '布局保存失败：' + e.message;
    }
  }

  // ============================================================
  //  Gridstack 看板布局
  // ============================================================
  let widgetGrid = null;          // gridstack 实例
  let layoutSaveTimer = null;     // 持久化防抖
  let layoutMutationObserver = null;
  let layoutWatchTimer = null;
  let lastLayoutSignature = '';

  // 4 档预设尺寸（w, h），基于 12 列网格
  const SIZE_PRESETS = {
    small:  { w: 1,  h: 1, label: '最小 (1x1)' },
    medium: { w: 6,  h: 4, label: '中 (半宽)' },
    large:  { w: 6,  h: 6, label: '大 (半宽·高)' },
    xlarge: { w: 12, h: 5, label: '横长条 (整行)' },
  };

  function initWidgetGrid() {
    if (widgetGrid || !window.GridStack) return;
    widgetGrid = GridStack.init({
      column: 12,
      cellHeight: 70,
      margin: 8,
      float: false,        // 自动堆叠：拖动后其他 widget 上移填充空白
      minRow: 1,
      alwaysShowResizeHandle: true,
      disableOneColumnMode: false,
      oneColumnModeDomSort: true,
      // 缩放配置：显示右下、右、下三个方向的手柄
      resizable: { handles: 'e, se, s' },
      // 拖拽配置：按住标题栏拖动，但点击菜单/地图控件时不触发
      draggable: { handle: '.widget-header', cancel: '.widget-menu, .map-controls, .chart-edit-actions' },
      // 占位符：拖拽时显示虚线轮廓
      placeholderClass: 'grid-stack-placeholder',
      placeholderText: '',
    });

    // 拖拽/缩放过程中：实时 resize echarts/leaflet（gridstack v12 的 'resize'/'drag' 事件持续触发）
    function resizeWidgetContent(el) {
      if (!el) return;
      var bodyEl = el.querySelector('.widget-body');
      var chartEl = bodyEl && bodyEl.querySelector('.native-chart');
      if (chartEl) {
        var inst = echarts.getInstanceByDom(chartEl);
        if (inst) inst.resize();
      }
      if (el.classList.contains('is-map-widget') && map) {
        map.invalidateSize({ pan: false });
      }
    }
    widgetGrid.on('resize', function(event, el) {
      resizeWidgetContent(el);
      // resize 持续触发时实时更新 widget 尺寸（仅内存，不触发保存；保存由 resizestop 负责）
      // 避免 resize 在 resizestop 之后仍可能触发一次，携带中间态数值覆盖正确值导致保存错误
      if (el) {
        syncWidgetLayoutFromElement(el);
      }
    });
    widgetGrid.on('drag', function(event, el) {
      resizeWidgetContent(el);
      if (el) {
        syncWidgetLayoutFromElement(el, { size: false });
      }
    });

    // 兜底：用 ResizeObserver 监听每个 widget-body 尺寸变化（覆盖窗口缩放等场景）
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function(entries) {
        entries.forEach(function(entry) {
          var bodyEl = entry.target;
          var chartEl = bodyEl.querySelector('.native-chart');
          if (chartEl) {
            var inst = echarts.getInstanceByDom(chartEl);
            if (inst) inst.resize();
          }
        });
      });
      // 在 load 后观察所有 widget-body
      var _origLoad = widgetGrid.load.bind(widgetGrid);
      widgetGrid.load = function(items) {
        var ret = _origLoad(items);
        widgetGrid.getGridItems().forEach(function(el) {
          var bodyEl = el.querySelector('.widget-body');
          if (bodyEl) ro.observe(bodyEl);
        });
        return ret;
      };
    }

    // 拖拽/缩放结束后：触发保存 + 最后一次 resize
    widgetGrid.on('dragstop resizestop', function(event, el) {
      if (!el) return;
      resizeWidgetContent(el);
      syncWidgetLayoutFromElement(el, { size: !(event && event.type === 'dragstop') });
      scheduleSaveLayout(event && event.type === 'resizestop' ? 80 : 500);
    });

    // gridstack 的 change 事件：完成任何布局变更后（拖拽/缩放/增删）触发保存
    // 比 resizestop 更可靠，因为它在内部所有计算完成后才触发
    widgetGrid.on('change', function() {
      if (window._gsLoading) return;  // 跳过初始加载
      scheduleSaveLayout();
    });

    // 应用持久化的锁定状态
    applyLockState();
    observeGridLayoutChanges();
    startLayoutWatch();
  }

  function observeGridLayoutChanges() {
    const gridEl = document.getElementById('widgetGrid');
    if (!gridEl || !window.MutationObserver) return;
    if (layoutMutationObserver) layoutMutationObserver.disconnect();
    layoutMutationObserver = new MutationObserver(function(records) {
      if (window._gsLoading) return;
      var changed = records.some(function(record) {
        return record.target && record.target.classList && record.target.classList.contains('grid-stack-item');
      });
      if (changed) scheduleSaveLayout(120);
    });
    layoutMutationObserver.observe(gridEl, {
      subtree: true,
      attributes: true,
      attributeFilter: ['gs-x', 'gs-y', 'gs-w', 'gs-h'],
    });
  }

  function getCurrentLayoutSignature() {
    if (!widgetGrid) return '';
    return widgetGrid.getGridItems().map(function(el) {
      var layout = gridUnitsFromElementRect(el);
      return [
        el.getAttribute('gs-id') || '',
        layout ? layout.x : (el.getAttribute('gs-x') || '0'),
        layout ? layout.y : (el.getAttribute('gs-y') || '0'),
        layout ? layout.w : (el.getAttribute('gs-w') || '1'),
        layout ? layout.h : (el.getAttribute('gs-h') || '1'),
      ].join(':');
    }).join('|');
  }

  function rememberCurrentLayoutSignature() {
    lastLayoutSignature = getCurrentLayoutSignature();
  }

  function startLayoutWatch() {
    if (layoutWatchTimer) return;
    layoutWatchTimer = setInterval(function() {
      if (window._gsLoading || !widgetGrid) return;
      var signature = getCurrentLayoutSignature();
      if (!signature) return;
      if (!lastLayoutSignature) {
        lastLayoutSignature = signature;
        return;
      }
      if (signature !== lastLayoutSignature) {
        lastLayoutSignature = signature;
        scheduleSaveLayout(80);
      }
    }, 150);
  }

  let layoutInteractionActive = false;
  document.addEventListener('mousedown', function(e) {
    if (!widgetGrid || isDashboardLocked) return;
    if (e.target.closest('#widgetGrid .ui-resizable-handle, #widgetGrid .widget-header')) {
      layoutInteractionActive = true;
    }
  }, true);
  document.addEventListener('touchstart', function(e) {
    if (!widgetGrid || isDashboardLocked) return;
    if (e.target.closest('#widgetGrid .ui-resizable-handle, #widgetGrid .widget-header')) {
      layoutInteractionActive = true;
    }
  }, true);

  function finishLayoutInteraction() {
    if (!layoutInteractionActive) return;
    layoutInteractionActive = false;
    scheduleSaveLayout(120);
  }
  document.addEventListener('mouseup', finishLayoutInteraction, true);
  document.addEventListener('touchend', finishLayoutInteraction, true);
  document.addEventListener('touchcancel', finishLayoutInteraction, true);

  function scheduleSaveLayout(delay) {
    if (layoutSaveTimer) clearTimeout(layoutSaveTimer);
    layoutSaveTimer = setTimeout(function() {
      saveUserDashboardWidgets();
      layoutSaveTimer = null;
    }, typeof delay === 'number' ? delay : 500);
  }

  async function renderDashboardWidgets() {
    const gridEl = document.getElementById('widgetGrid');
    if (!gridEl) return;
    // 清理前先 dispose 所有 echarts 实例，避免内存泄漏
    chartInstances.forEach(function(inst) { if (inst && inst.dispose) inst.dispose(); });
    chartInstances.clear();

    // 清理 leaflet 实例：removeAll 会销毁 #map DOM，需先释放 map 再重建
    if (map) {
      map.remove();
      map = null;
      markersLayer = null;
      currentBasemapLayer = null;
      currentBasemapKey = null;  // 必须重置，否则 syncMapBasemapWithTheme 会跳过底图创建
    }

    // 首次初始化 gridstack
    if (!widgetGrid) initWidgetGrid();
    if (!widgetGrid) return;

    window._gsLoading = true;  // 阻止 change 事件在初始加载期间触发保存
    // 清空网格（会触发 change 事件）
    widgetGrid.removeAll(true);

    // float: true 确保 load 时精确保存位置，不触发 auto-stack 避免相邻 widget 被推移
    var prevFloat = widgetGrid.float;
    widgetGrid.float = true;

    // 加载所有 widget（metric + chart + map 统一管理）
    // 注意：不使用 gridstack 的 content 字段（v12 行为不一致），改用 load 后手动注入 innerHTML
    const items = dashboardWidgets.map(function(widget) {
      var isMap = widget.type === 'map';
      return {
        id: widget.id,
        x: parseInt(widget.x, 10) || 0,
        y: parseInt(widget.y, 10) || 0,
        w: parseInt(widget.w, 10) || (isMap ? 12 : (widget.type === 'metric' ? 3 : 6)),
        h: parseInt(widget.h, 10) || (isMap ? 6 : (widget.type === 'metric' ? 2 : 4)),
        minW: GRID_WIDGET_MIN_W,
        maxW: 12,
        minH: GRID_WIDGET_MIN_H,
        maxH: 12,
      };
    });

    widgetGrid.load(items);
    widgetGrid.getGridItems().forEach(function(el) {
      refreshWidgetResizeConstraints(el);
    });

    // 恢复 float 状态
    widgetGrid.float = prevFloat;

    // 手动渲染每个 widget 的 HTML 内容（避免 gridstack content 注入的版本差异）
    widgetGrid.getGridItems().forEach(function(el) {
      var node = el.gridstackNode;
      if (!node) return;
      var widget = dashboardWidgets.find(function(w) { return w.id === node.id; });
      if (!widget) return;
      var contentEl = el.querySelector('.grid-stack-item-content');
      if (contentEl) {
        contentEl.innerHTML = renderWidgetInner(widget);
        if (widget.type === 'metric') el.classList.add('is-metric');
        if (widget.type === 'map') el.classList.add('is-map-widget');
      }
    });

    // 渲染每个 widget 的数据（单个失败不影响其他 widget）
    for (const widget of dashboardWidgets) {
      try {
        await renderNativeChartWidget(widget);
      } catch (e) {
        // 在该 widget 容器内显示空状态提示
        const widgetBody = findWidgetItem(widget.id) && findWidgetItem(widget.id).querySelector('.widget-body');
        if (widgetBody) widgetBody.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--g-light-text);font-size:12px;">加载失败</div>';
      }
    }
    window._gsLoading = false;
    rememberCurrentLayoutSignature();
  }

  function renderWidgetInner(widget) {
    var isMetric = widget.type === 'metric';
    var isMap = widget.type === 'map';
    var header;
    if (isMap) {
      // 地图 widget：标题 + 全屏/收起按钮，无编辑/删除
      header = '<div class="widget-header">' +
        '<div class="widget-title"><span class="btn-symbol">◇</span> ' + escapeHtml(widget.title) + '</div>' +
        '<div class="map-controls">' +
          '<button class="btn-fullscreen" id="btnCollapse" onclick="toggleCollapse()">▴ 收起</button>' +
        '</div>' +
      '</div>';
      var mapBody = '<div class="widget-body"><div id="map"></div></div>';
      return header + mapBody;
    }
    header = '<div class="widget-header">' +
      '<div class="widget-title">' + escapeHtml(widget.title) + '</div>' +
      '<div class="widget-menu">' +
        '<button class="widget-menu-btn" onclick="toggleWidgetMenu(this)" aria-label="操作">⋯</button>' +
        '<div class="widget-menu-dropdown">' +
          '<button class="widget-menu-item" onclick="refreshGristWidget(this); closeWidgetMenu(this)"><span class="widget-menu-icon">⟳</span>刷新</button>' +
          '<button class="widget-menu-item" onclick="editGristWidget(this)"><span class="widget-menu-icon">✎</span>编辑</button>' +
          '<div class="widget-menu-divider"></div>' +
          '<button class="widget-menu-item is-danger" onclick="closeGristWidget(this)"><span class="widget-menu-icon">✕</span>删除</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    var body = isMetric
      ? '<div class="widget-body"><div class="metric-label">' + escapeHtml(widget.title) + '</div><div class="metric-value" id="widget-' + escapeHtml(widget.id) + '">-</div></div>'
      : '<div class="widget-body"><div class="native-chart" id="widget-' + escapeHtml(widget.id) + '"></div></div>';
    return header + body;
  }

  async function renderNativeChartWidget(widget) {
    // 地图 widget：初始化 leaflet（仅首次），不请求 chart-data
    if (widget.type === 'map') {
      var mapEl = document.getElementById('map');
      if (mapEl && !map) {
        initMap();
        // 用缓存的 stats 数据恢复 markers（避免重新 fetch；首次加载时 _lastByRegion 为空，由 onLoginSuccess 的 loadStats 填充）
        if (_lastByRegion.length) updateMap(_lastByRegion);
      } else if (map) {
        // 地图已初始化，只需刷新尺寸
        setTimeout(refreshDashboardLayout, 100);
      }
      return;
    }
    const el = document.getElementById('widget-' + widget.id);
    if (!el) return;
    const res = await fetch('/api/chart-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify(widget),
    });
    if (!res.ok) {
      // 请求失败时在容器内显示友好提示，避免空白
      el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--g-light-text);font-size:12px;">暂无数据</div>';
      return;
    }
    const data = await res.json();
    if (data.type === 'metric') {
      el.textContent = data.value != null ? Number(data.value).toLocaleString() : '-';
      return;
    }
    const existing = chartInstances.get(widget.id);
    if (existing) {
      existing.dispose();
      chartInstances.delete(widget.id);
    }
    const instance = echarts.init(el);
    chartInstances.set(widget.id, instance);
    instance.setOption(buildChartOption(data), true);
  }

  function getCurrentChartPalette() {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    return CHART_THEME_PALETTES[theme];
  }

  function rerenderNativeChartsForTheme() {
    if (!window.echarts || !dashboardWidgets.length) return;
    dashboardWidgets
      .filter(function(widget) { return widget.type !== 'metric'; })
      .forEach(function(widget) { renderNativeChartWidget(widget); });
  }

  function createVerticalGradient(topColor, bottomColor) {
    return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
      { offset: 0, color: topColor },
      { offset: 1, color: bottomColor }
    ]);
  }

  function buildChartOption(data) {
    const cs = getComputedStyle(document.documentElement);
    const palette = getCurrentChartPalette();
    const axisColor = cs.getPropertyValue('--g-chart-axis').trim();
    const splitColor = cs.getPropertyValue('--g-chart-split').trim();
    const tooltip = {
      backgroundColor: palette.tooltipBg,
      borderColor: palette.tooltipBorder,
      borderWidth: 1,
      textStyle: { color: palette.tooltipText }
    };
    if (data.type === 'pie') {
      return {
        color: palette.colors,
        tooltip: Object.assign({ trigger: 'item' }, tooltip),
        legend: { bottom: 4, textStyle: { color: axisColor }, itemWidth: 10, itemHeight: 10 },
        series: [{
          type: 'pie',
          radius: ['42%', '70%'],
          center: ['50%', '45%'],
          avoidLabelOverlap: true,
          itemStyle: { borderColor: palette.pieBorder, borderWidth: 2 },
          label: { color: axisColor },
          data: data.labels.map((label, i) => ({ name: label, value: data.values[i] }))
        }],
      };
    }
    const isLine = data.type === 'line';
    return {
      color: palette.colors,
      tooltip: Object.assign({ trigger: 'axis', axisPointer: { type: isLine ? 'line' : 'shadow' } }, tooltip),
      grid: { left: 48, right: 16, bottom: 48, top: 24 },
      xAxis: {
        type: 'category',
        data: data.labels,
        axisTick: { show: false },
        axisLine: { lineStyle: { color: splitColor } },
        axisLabel: { color: axisColor, rotate: data.labels.length > 8 ? 30 : 0 }
      },
      yAxis: {
        type: 'value',
        axisLabel: { color: axisColor },
        splitLine: { lineStyle: { color: splitColor } }
      },
      series: [{
        type: isLine ? 'line' : 'bar',
        data: data.values,
        smooth: isLine,
        symbol: isLine ? 'circle' : 'none',
        symbolSize: isLine ? 6 : 0,
        barMaxWidth: 42,
        lineStyle: isLine ? { width: 3, color: palette.colors[1] } : undefined,
        areaStyle: isLine ? { opacity: 0.18, color: createVerticalGradient(palette.lineAreaStart, palette.lineAreaEnd) } : undefined,
        itemStyle: isLine
          ? { color: palette.colors[1] }
          : { color: createVerticalGradient(palette.barStart, palette.barEnd), borderRadius: [3, 3, 0, 0] }
      }],
    };
  }

  window.refreshGristWidget = function(button) {
    const card = button.closest('.grid-stack-item') || button.closest('.chart-widget-card');
    let widgetId = card?.dataset.widgetId || (card?.gridstackNode && card.gridstackNode.id);
    if (!widgetId) {
      const inner = card && card.querySelector('[id^="widget-"]');
      if (inner) widgetId = inner.id.replace('widget-', '');
    }
    const widget = dashboardWidgets.find(item => item.id === widgetId);
    if (widget) renderNativeChartWidget(widget);
  };

  function getTableSchema(tableId) {
    if (!chartSchema || !chartSchema.tables) return null;
    return chartSchema.tables.find(function(t) { return t.id === tableId; });
  }

  function isNumericChartField(field) {
    var type = String((field && field.type) || '').toLowerCase();
    return type.indexOf('numeric') !== -1 || type.indexOf('number') !== -1 || type.indexOf('int') !== -1 || type.indexOf('float') !== -1;
  }

  function getFieldOptions(fields, selectedField, includeEmptyLabel) {
    var options = includeEmptyLabel ? '<option value="">' + escapeHtml(includeEmptyLabel) + '</option>' : '';
    options += fields.map(function(f) {
      var selected = f.id === selectedField ? ' selected' : '';
      return '<option value="' + escapeHtml(f.id) + '"' + selected + '>' + escapeHtml(f.label || f.id) + '</option>';
    }).join('');
    return options;
  }

  function getMetricTypeOptions(selectedType) {
    var types = [
      { key: 'count', label: '计数' },
      { key: 'sum', label: '求和' },
      { key: 'avg', label: '平均值' },
      { key: 'max', label: '最大值' },
      { key: 'min', label: '最小值' }
    ];
    return types.map(function(t) {
      var selected = t.key === selectedType ? ' selected' : '';
      return '<option value="' + t.key + '"' + selected + '>' + t.label + '</option>';
    }).join('');
  }

  function getMetricFieldOptions(fields, metricType, selectedField) {
    if (metricType === 'count') return '<option value="">计数不需要选择字段</option>';
    var numericFields = fields.filter(isNumericChartField);
    var sourceFields = numericFields.length ? numericFields.slice() : fields.slice();
    if (selectedField && !sourceFields.some(function(f) { return f.id === selectedField; })) {
      var selected = fields.find(function(f) { return f.id === selectedField; });
      if (selected) sourceFields.unshift(selected);
    }
    if (!sourceFields.length) return '<option value="">没有可用字段</option>';
    return getFieldOptions(sourceFields, selectedField);
  }

  function getMetricFieldHint(fields, metricType) {
    if (metricType === 'count') return '计数不需要选择字段';
    return fields.some(isNumericChartField) ? '仅显示可计算的数值字段' : '未识别到数值字段，暂显示全部字段';
  }

  function updateMetricFieldOptions(card, selectedField) {
    if (!card) return;
    var tableSelect = card.querySelector('.edit-table-id');
    var metricTypeSelect = card.querySelector('.edit-metric-type');
    var metricFieldSelect = card.querySelector('.edit-metric-field');
    if (!tableSelect || !metricTypeSelect || !metricFieldSelect) return;
    var tableSchema = getTableSchema(tableSelect.value);
    var fields = (tableSchema && tableSchema.fields) || [];
    var metricType = metricTypeSelect.value || 'count';
    var previousField = selectedField || metricFieldSelect.value;
    metricFieldSelect.innerHTML = getMetricFieldOptions(fields, metricType, previousField);
    metricFieldSelect.disabled = metricType === 'count';
    if (!metricFieldSelect.disabled && !metricFieldSelect.value && metricFieldSelect.options.length) {
      metricFieldSelect.selectedIndex = 0;
    }
    var hint = card.querySelector('.edit-metric-field-hint');
    if (hint) hint.textContent = getMetricFieldHint(fields, metricType);
  }

  function buildChartEditFormHTML(widget) {
    var tables = (chartSchema && chartSchema.tables) || [];
    var tableOptions = tables.map(function(t) {
      var selected = t.id === widget.tableId ? ' selected' : '';
      // 显示中文视图名(如"重大客户区域分级总览"),没有时回退到 table.id
      var displayName = t.label || t.id;
      return '<option value="' + escapeHtml(t.id) + '"' + selected + '>' + escapeHtml(displayName) + '</option>';
    }).join('');
    var tableSchema = getTableSchema(widget.tableId);
    var fields = (tableSchema && tableSchema.fields) || [];
    var metricType = (widget.metric && widget.metric.type) || 'count';
    var dimensionOptions = getFieldOptions(fields, widget.dimension);
    var metricTypeOptions = getMetricTypeOptions(metricType);
    var metricFieldOptions = getMetricFieldOptions(fields, metricType, widget.metric && widget.metric.field);
    var metricFieldDisabled = metricType === 'count' ? ' disabled' : '';
    var metricFieldHint = getMetricFieldHint(fields, metricType);
    var types = [
      { key: 'bar', label: '柱状图', icon: '▥' },
      { key: 'line', label: '折线图', icon: '⌁' },
      { key: 'pie', label: '饼图', icon: '◔' }
    ];
    var typeButtons = types.map(function(t) {
      var cls = t.key === widget.type ? ' active' : '';
      return '<button type="button" class="chart-type-btn' + cls + '" data-type="' + t.key + '" onclick="selectChartType(this)"><span class="chart-type-icon">' + t.icon + '</span><span>' + t.label + '</span></button>';
    }).join('');
    // 4 档预设尺寸（所有 widget 类型均可选）
    var currentW = parseInt(widget.w, 10) || (widget.type === 'metric' ? 3 : 6);
    var currentH = parseInt(widget.h, 10) || (widget.type === 'metric' ? 2 : 4);
    var currentPresetKey = 'medium';
    Object.keys(SIZE_PRESETS).forEach(function(k) {
      if (SIZE_PRESETS[k].w === currentW && SIZE_PRESETS[k].h === currentH) currentPresetKey = k;
    });
    var presetButtonsHtml = Object.keys(SIZE_PRESETS).map(function(k) {
      var p = SIZE_PRESETS[k];
      var cls = k === currentPresetKey ? ' active' : '';
      return '<button type="button" class="chart-type-btn preset-size-btn' + cls +
        ' data-preset="' + k + '" data-w="' + p.w + '" data-h="' + p.h + '" onclick="selectPresetSize(this)">' +
        '<span>' + p.label + '</span></button>';
    }).join('');
    return '<div class="chart-edit-form">' +
      '<div class="chart-editor-section">' +
        '<div class="chart-editor-section-title"><span class="chart-editor-section-icon">▤</span><span>数据来源</span></div>' +
        '<div class="chart-editor-layout">' +
          '<div class="chart-edit-field">' +
            '<label>图表标题</label>' +
            '<input type="text" class="edit-title" value="' + escapeHtml(widget.title || '自定义图表') + '" placeholder="自定义图表">' +
          '</div>' +
          '<div class="chart-edit-field">' +
            '<label>数据表</label>' +
            '<select class="edit-table-id" onchange="changeEditTable(this)">' + tableOptions + '</select>' +
          '</div>' +
          '<div class="chart-edit-field">' +
            '<label>分类字段</label>' +
            '<select class="edit-dimension">' + dimensionOptions + '</select>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="chart-editor-section">' +
        '<div class="chart-editor-section-title"><span class="chart-editor-section-icon">∑</span><span>统计指标</span></div>' +
        '<div class="chart-editor-layout single">' +
          '<div class="chart-edit-field">' +
            '<label>计算方式 / 数值字段</label>' +
            '<div class="chart-edit-metric">' +
              '<select class="edit-metric-type" onchange="toggleEditMetricField(this)">' + metricTypeOptions + '</select>' +
              '<select class="edit-metric-field"' + metricFieldDisabled + '>' + metricFieldOptions + '</select>' +
            '</div>' +
            '<div class="chart-edit-hint edit-metric-field-hint">' + escapeHtml(metricFieldHint) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="chart-editor-section">' +
        '<div class="chart-editor-section-title"><span class="chart-editor-section-icon">▦</span><span>展示方式</span></div>' +
        '<div class="chart-edit-type-group">' + typeButtons + '</div>' +
      '</div>' +
      '<div class="chart-editor-section">' +
        '<div class="chart-editor-section-title"><span class="chart-editor-section-icon">⤢</span><span>预设尺寸（也可关闭编辑后直接拖拽角点调整）</span></div>' +
        '<div class="chart-edit-type-group">' + presetButtonsHtml + '</div>' +
      '</div>' +
      '<div class="chart-edit-actions">' +
        '<button class="chart-action-btn primary" onclick="saveGristWidget(this)">保存</button>' +
        '<button class="chart-action-btn" onclick="cancelEditGristWidget(this)">取消</button>' +
      '</div>' +
    '</div>';
  }

  window.selectPresetSize = function(button) {
    if (button.disabled) return;
    var card = button.closest('.grid-stack-item') || button.closest('.chart-widget-card');
    if (!card) return;
    card.querySelectorAll('.preset-size-btn').forEach(function(b) { b.classList.remove('active'); });
    button.classList.add('active');
    card.dataset.pendingW = button.dataset.w;
    card.dataset.pendingH = button.dataset.h;
  };

  function setChartWidgetEditMode(card, editing) {
    if (!card) return;
    card.classList.toggle('editing', editing);
    // 编辑态由 CSS 隐藏 "⋯" 菜单；保存/取消按钮已移入编辑表单
  }

  // ---- "⋯" 菜单开关（单一 document 监听 + 当前打开菜单引用，避免监听器泄漏） ----
  let _openWidgetMenu = null;
  window.toggleWidgetMenu = function(btn) {
    var dropdown = btn.parentElement.querySelector('.widget-menu-dropdown');
    if (!dropdown) return;
    var willOpen = !dropdown.classList.contains('open');
    // 先关闭其他已打开的菜单
    if (_openWidgetMenu && _openWidgetMenu !== dropdown) {
      _openWidgetMenu.classList.remove('open');
    }
    if (willOpen) {
      dropdown.classList.add('open');
      _openWidgetMenu = dropdown;
    } else {
      dropdown.classList.remove('open');
      _openWidgetMenu = null;
    }
  };
  window.closeWidgetMenu = function(btn) {
    var dropdown = btn.closest('.widget-menu-dropdown');
    if (dropdown) dropdown.classList.remove('open');
    _openWidgetMenu = null;
  };
  // 单一 document 监听：点击 .widget-menu 外部时关闭当前打开的菜单
  document.addEventListener('click', function(e) {
    if (_openWidgetMenu && !e.target.closest('.widget-menu')) {
      _openWidgetMenu.classList.remove('open');
      _openWidgetMenu = null;
    }
  });

  window.selectChartType = function(btn) {
    btn.parentElement.querySelectorAll('.chart-type-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  };

  window.toggleEditMetricField = function(select) {
    updateMetricFieldOptions(select.closest('.grid-stack-item, .chart-widget-card, .stat-card'));
  };

  window.changeEditTable = function(select) {
    var card = select.closest('.grid-stack-item, .chart-widget-card, .stat-card');
    if (!card) return;
    var tableId = select.value;
    var tableSchema = getTableSchema(tableId);
    var fields = (tableSchema && tableSchema.fields) || [];
    var dimensionSelect = card.querySelector('.edit-dimension');
    if (dimensionSelect) {
      var includeEmptyLabel = card.classList.contains('stat-card') ? '(无)' : null;
      dimensionSelect.innerHTML = getFieldOptions(fields, '', includeEmptyLabel);
    }
    updateMetricFieldOptions(card);
  };

  // 查找 widget 所在的 grid-stack-item 元素
  function findWidgetItem(widgetId) {
    if (!widgetGrid) return null;
    var items = widgetGrid.getGridItems();
    for (var i = 0; i < items.length; i++) {
      var el = items[i].querySelector('[id="widget-' + widgetId + '"]');
      if (el) return items[i];
    }
    return null;
  }

  window.editGristWidget = function(button) {
    var card = button.closest('.grid-stack-item') || button.closest('.chart-widget-card');
    if (!card) return;
    var widgetId = card.dataset.widgetId || (card.gridstackNode && card.gridstackNode.id);
    // 兜底：从内部 DOM 找 widget id
    if (!widgetId) {
      var inner = card.querySelector('[id^="widget-"]');
      if (inner) widgetId = inner.id.replace('widget-', '');
    }
    var widget = dashboardWidgets.find(function(w) { return w.id === widgetId; });
    if (!widget) return;
    var bodyEl = card.querySelector('.widget-body');
    if (!bodyEl) return;
    // 清空原内容，渲染编辑表单
    bodyEl.innerHTML = '';
    bodyEl.insertAdjacentHTML('beforeend', buildChartEditFormHTML(widget));
    setChartWidgetEditMode(card, true);
  };

  window.saveGristWidget = async function(button) {
    var card = button.closest('.grid-stack-item') || button.closest('.chart-widget-card');
    if (!card) return;
    var widgetId = card.dataset.widgetId || (card.gridstackNode && card.gridstackNode.id);
    if (!widgetId) {
      var inner = card.querySelector('[id^="widget-"]');
      if (inner) widgetId = inner.id.replace('widget-', '');
    }
    var widget = dashboardWidgets.find(function(w) { return w.id === widgetId; });
    if (!widget) return;
    var titleInput = card.querySelector('.edit-title');
    widget.title = (titleInput && titleInput.value.trim()) || '自定义图表';
    widget.tableId = card.querySelector('.edit-table-id').value;
    widget.dimension = card.querySelector('.edit-dimension').value;
    widget.metric.type = card.querySelector('.edit-metric-type').value;
    var metricFieldSelect = card.querySelector('.edit-metric-field');
    widget.metric.field = metricFieldSelect && !metricFieldSelect.disabled ? metricFieldSelect.value : undefined;
    var activeTypeBtn = card.querySelector('.chart-type-btn.active:not(.preset-size-btn)');
    if (activeTypeBtn) widget.type = activeTypeBtn.dataset.type;
    // 读取预设尺寸
    if (card.dataset.pendingW) widget.w = parseInt(card.dataset.pendingW, 10);
    if (card.dataset.pendingH) widget.h = parseInt(card.dataset.pendingH, 10);

    // 通过 gridstack API 更新 widget 尺寸 + 内容
    if (widgetGrid) {

  // 长按拖动排序（pointer events 实现，兼容鼠标/触摸）
  function initSidebarDrag() {
    const nav = document.querySelector('.sidebar-nav');
    if (!nav) return;
    let dragItem = null;
    let pressTimer = null;
    let isDragging = false;
    const LONG_PRESS_MS = 350;

    nav.addEventListener('pointerdown', function(e) {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      // 阻止立即触发 click
      const startX = e.clientX, startY = e.clientY;
      pressTimer = setTimeout(function() {
        isDragging = true;
        dragItem = item;
        item.classList.add('dragging');
        e.preventDefault();
      }, LONG_PRESS_MS);
      // 提前松手或移动则取消长按计时
      function cancel() {
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        document.removeEventListener('pointerup', cancel);
        document.removeEventListener('pointermove', onMove);
      }
      function onMove(ev) {
        if (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5) cancel();
      }
      document.addEventListener('pointerup', cancel);
      document.addEventListener('pointermove', onMove);
    });

    nav.addEventListener('pointermove', function(e) {
      if (!isDragging || !dragItem) return;
      const target = e.target.closest('.nav-item');
      if (!target || target === dragItem) return;
      // 判断鼠标在目标项的上半还是下半，决定插入位置
      const rect = target.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      nav.querySelectorAll('.nav-item').forEach(it => it.classList.remove('drag-over'));
      target.classList.add('drag-over');
      e.preventDefault();
    });

    document.addEventListener('pointerup', function(e) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (!isDragging || !dragItem) return;
      isDragging = false;
      const target = e.target.closest('.nav-item');
      if (target && target !== dragItem) {
        const rect = target.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;
        if (after) target.parentNode.insertBefore(dragItem, target.nextSibling);
        else target.parentNode.insertBefore(dragItem, target);
        // 持久化新顺序
        const order = Array.from(nav.querySelectorAll('.nav-item')).map(it => it.dataset.page).filter(Boolean);
        safeLocalStorage(SIDEBAR_ORDER_KEY, JSON.stringify(order));
      }
      dragItem.classList.remove('dragging');
      nav.querySelectorAll('.nav-item').forEach(it => it.classList.remove('drag-over'));
      // 阻止拖动结束后误触发 click 切换页面
      const suppressed = dragItem;
      if (suppressed) {
        const blocker = function(ev) {
          ev.preventDefault();
          ev.stopPropagation();
          document.removeEventListener('click', blocker, true);
        };
        document.addEventListener('click', blocker, true);
      }
      dragItem = null;
    });
  }

        const disabled = u.isAdmin ? 'disabled' : '';

        return '<tr>' +

          '<td>' + escapeHtml(u.name || '-') + '</td>' +

              '<span class="slider"></span>' +

  function updateMap(byRegion) {
    if (!markersLayer) return;
    markersLayer.clearLayers();
    if (!byRegion || !byRegion.length) return;
    byRegion.forEach(r => {
      if (r.coord_lat == null || r.coord_lng == null) return;
      const radius = Math.max(8, Math.min(40, Math.sqrt(r.total) * 6));
      const marker = L.circleMarker([r.coord_lat, r.coord_lng], {
        radius: radius,
        fillColor: r.color || getComputedStyle(document.documentElement).getPropertyValue('--g-map-marker').trim(),
        color: '#fff', weight: 2, opacity: 0.9, fillOpacity: 0.7
      });
      marker.bindPopup(
        '<div style="min-width:160px;font-size:13px;">' +
        '<strong style="font-size:14px;">' + escapeHtml(r.title || r.label) + '</strong><br/>' +
        '客户总数：<b>' + escapeHtml(r.total) + '</b><br/>' +
        'A级：' + escapeHtml(r.ratingA) + ' &nbsp; B级：' + escapeHtml(r.ratingB) + ' &nbsp; C级：' + escapeHtml(r.ratingC) + '<br/>' +
        '预计贡献：<b>' + escapeHtml(r.estimate) + '</b> 万元' +
        '</div>'
      );
      markersLayer.addLayer(marker);
    });
    const bounds = markersLayer.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 6 });
      applyMapCoverageBounds();
    }
  }

      onLoginSuccess();
    } catch (e) {
      errorEl.textContent = '网络连接失败，请检查服务器';
      btn.disabled = false;
      btn.textContent = '登 录';
    }
  };


  async function checkAuth() {
    try {
      const res = await fetch('/api/auth/me');
      if (res.ok) {
        const data = await res.json();
        if (data.authenticated) {
          currentUser = data.user;
          updateUserUI(data.user);
          return true;
        }
      }
      // 不再自动从 Grist 会话同步认证信息，必须通过 A9 登录
    } catch (e) {
      console.warn('[Auth] checkAuth failed:', e.message);
    }
    return false;
  }

  let _dashboardListenersAttached = false;

  async function onLoginSuccess() {
    updateUserUI(currentUser);
    // 地图初始化移到 renderDashboardWidgets 中（#map 元素在 gridstack widget 内动态创建）
    const mapReady = await ensureLeafletLoaded();
    if (!mapReady) document.getElementById('footerInfo').textContent = '地图组件加载失败，其他看板数据仍可使用';
    applyLockState();        // 首次渲染前应用锁定状态（按钮图标 + body class）
    // 先渲染看板（含 map widget 初始化），再加载统计数据
    // 避免 loadStats 的 updateMap 与 renderDashboardWidgets 的 map 重建产生竞态
    await loadDashboardWidgets();
    loadStats();
    if (!_dashboardListenersAttached) {
      _dashboardListenersAttached = true;
      window.addEventListener('resize', refreshDashboardLayout);
    }
  }

  window.doLogout = async function() {
    // 清除空数据轮询定时器，避免登出后继续触发 loadStats
    if (_emptyPollTimer) { clearInterval(_emptyPollTimer); _emptyPollTimer = null; }
    try {
      const res = await fetch('/api/auth/logout', { method: 'POST' });
      if (res.ok) {
        currentUser = null;
        const footer = document.getElementById('sidebarFooter');
        if (footer) footer.style.display = 'none';
        showLogin();
      } else {
        console.error('登出失败');
      }
    } catch (e) {
      console.error('登出请求失败', e);
    }
  };

  document.addEventListener('DOMContentLoaded', async function() {
    // 如果在 iframe 中加载，不初始化（防止 Grist 代理回退时递归嵌套）
    if (window.self !== window.top) return;

    initSidebar();
    const authed = await checkAuth();
    if (authed) {
      onLoginSuccess();
    } else {
      showLogin();
    }
  });

})();

    document.head.insertAdjacentHTML('beforeend', styleHtml);

    // ---------- 元素引用 ----------

    const input = document.getElementById('agentInput');

    const statusEl = document.getElementById('agentStatus');

    const resizeHandle = document.getElementById('agentResizeHandle');
    const header = panel.querySelector('.agent-header');

    let isOpen = false;

    // ---------- WebSocket 连接管理 ----------
    let ws = null;
    let chatId = null;
    let isStreaming = false;
    let currentBotBubble = null;   // 当前流式回复的气泡
    let currentBotText = '';       // 当前流式回复的累积文本

    async function connectWebSocket() {
      if (ws && ws.readyState <= 1) return; // 已连接或正在连接
      statusEl.textContent = '连接中...';
      statusEl.classList.remove('connected');
      try {
        const resp = await fetch('/api/agent/bootstrap');
        if (!resp.ok) throw new Error('bootstrap 失败');
        const data = await resp.json();
        const token = data.token || '';
        const wsUrl = `ws://${location.host}/api/agent/ws?token=${encodeURIComponent(token)}`;
        ws = new WebSocket(wsUrl);
        ws.onopen = () => { statusEl.textContent = '已连接'; statusEl.classList.add('connected'); };
        ws.onmessage = (ev) => handleWsMessage(ev);
        ws.onclose = () => {
          statusEl.textContent = '已断开';
          statusEl.classList.remove('connected');
          chatId = null;
          // 自动重连（5 秒后，面板打开时才重连）
          if (isOpen) setTimeout(() => { if (isOpen) connectWebSocket(); }, 5000);
        };
        ws.onerror = () => { statusEl.textContent = '连接错误'; };
      } catch (err) {
        statusEl.textContent = '连接失败';
        console.warn('[Munchkin] 连接失败:', err.message);
      }
    }

    function handleWsMessage(ev) {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      switch (msg.event) {
        case 'ready':
          chatId = msg.chat_id;
          break;
        case 'attached':
          chatId = msg.chat_id;
          break;
        case 'delta':
          // 流式文本追加
          if (!currentBotBubble) {
            currentBotBubble = createBotBubble();
            currentBotText = '';
          }
          currentBotText += msg.text || '';
          currentBotBubble.textContent = currentBotText;
          messages.scrollTop = messages.scrollHeight;
          break;
        case 'stream_end':
          // 当前流段结束，保留气泡，下一段会创建新气泡
          currentBotBubble = null;
          currentBotText = '';
          break;
        case 'reasoning_delta':
          // 思考过程（暂不显示，可扩展）
          break;
        case 'reasoning_end':
          break;
        case 'message':
          if (msg.kind === 'tool_hint' || msg.kind === 'progress') {
            // 工具调用提示
            appendToolHint(msg.text || '');
            if (msg.tool_events) {
              for (const te of msg.tool_events) {
                if (te.phase === 'start') {
                  toolHint.textContent = `调用 ${te.name}...`;
                }
              }
            }
          } else if (msg.text) {
            // 完整回复
            appendMessage(msg.text, 'bot');
          }
          break;
        case 'goal_status':
          if (msg.status === 'running') {
            typing.style.display = 'flex';
            isStreaming = true;
          } else if (msg.status === 'idle') {
            typing.style.display = 'none';
          }
          break;
        case 'turn_end':
          // agent 完全停止
          typing.style.display = 'none';
          isStreaming = false;
          toolHint.textContent = '';
          currentBotBubble = null;
          currentBotText = '';
          sendBtn.disabled = false;
          if (!isOpen) {
            unread++;
            badge.textContent = unread;
            badge.style.display = '';
          }
          // 检查是否有新 widget，刷新看板
          if (typeof loadDashboardWidgets === 'function') {
            loadDashboardWidgets();
          }
          break;
        case 'error':
          appendMessage('错误: ' + (msg.detail || '未知错误'), 'bot');
          typing.style.display = 'none';
          isStreaming = false;
          sendBtn.disabled = false;
          break;
      }
    }

    function createBotBubble() {
      const wrap = document.createElement('div');
      wrap.className = 'agent-msg agent-msg-bot';
      const bubble = document.createElement('div');
      bubble.className = 'agent-msg-bubble';
      wrap.appendChild(bubble);
      messages.appendChild(wrap);
      return bubble;
    }

    // ---------- 交互逻辑 ----------
    function openPanel() {

      }
    }
    function closePanel() {
      panel.style.display = 'none';
      fab.style.display = 'flex';
      isOpen = false;
    }
    function minimizePanel() {
      panel.style.display = 'none';
      fab.style.display = 'flex';

    fab.addEventListener('click', openPanel);

    // ---------- Munchkin 设置浮层（A9 自建，非 iframe） ----------
    const munchkinOverlay = document.getElementById('munchkinOverlay');

    function mkDot(status) {
      const cls = status === 'running' || status === 'connected' || status === true || status === 'ok' ? 'ok'
        : status === 'stopped' || status === 'error' || status === false || status === 'err' ? 'err'
        : status === 'starting' || status === 'warn' ? 'warn' : 'unknown';
      return `<span class="mk-status-dot ${cls}"></span>`;
    }

    function mkStatusLabel(status) {
      const map = { running: '运行中', starting: '启动中', stopped: '已停止', unknown: '未知',
        connected: '已连接', error: '错误', true: '可达', false: '不可达' };
      return map[status] !== undefined ? map[status] : status;
    }

    // 渲染设置页面
    function mkRender(cfg, status) {
      const providers = Object.keys(cfg.providers || {});
      const currentProvider = cfg.provider || providers[0] || '';
      const providerInfo = cfg.providers?.[currentProvider] || {};
      const params = cfg.parameters || {};
      const mcpServers = cfg.mcpServers || [];
      const skills = cfg.skills || [];
      const mcpServerStatus = status.mcpServerStatus || {};

      // 渲染 Skills 列表
      const skillsHtml = skills.length > 0 ? skills.map(s => {

        const isBuiltin = s.source === 'builtin';
        const canEdit = !isBuiltin;
        const actionsHtml = canEdit
          ? `<div class="mk-list-actions">
              <button class="mk-icon-btn" data-action="edit-skill" data-name="${s.name}" title="编辑">✎</button>

        // 内置 skill 在 title 前加绿色状态灯 + "常驻"说明;workspace skill 右侧保留开关

          ? '<span style="font-size:10px;color:var(--g-light-text);font-weight:400;">· 常驻已激活</span>'

        const toggleHtml = isBuiltin

          : `<div class="mk-toggle ${s.disabled ? '' : 'on'}" data-skill="${s.name}" title="${s.disabled ? '已禁用' : '已启用'}"></div>`;
        return `

      // 渲染 MCP servers 列表

        const statusText = runtimeStatus.status === 'connected' ? '已连接' : runtimeStatus.status === 'error' ? '错误' : '未连接';
        const toolsList = (runtimeStatus.tools && runtimeStatus.tools.length > 0)

        const toolsCount = runtimeStatus.toolsCount || 0;
        // 内置 MCP:状态灯 + 只读;自建 MCP:开关 + 编辑/删除
        if (s.builtin) {
          return `

                  </div>

        return `

                  <span>${s.name}</span>
                  <span style="font-size:10px;color:var(--g-light-text);font-weight:400;">· ${s.type} · ${statusText}${toolsCount > 0 ? ' · ' + toolsCount + ' 工具' : ''}</span>
                </div>
                <div class="mk-list-item-desc" style="font-family:ui-monospace,monospace;font-size:10px;">

    // 加载配置和状态

          if (!el.classList.contains('on')) disabledSkills.push(el.dataset.skill);
        });
        munchkinSettingsBody.querySelectorAll('.mk-toggle[data-mcp]').forEach(el => {
          mcpServerToggles.push({ name: el.dataset.mcp, enabled: el.classList.contains('on') });
        });
        const body = {
          provider: document.getElementById('mkProvider').value,
          model: document.getElementById('mkModel').value.trim(),
          apiBase: document.getElementById('mkApiBase').value.trim(),
          disabledSkills,
          mcpServerToggles,
        };
        const resp = await fetch('/api/agent/config', {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
          mkShowToast('已保存，需重启生效');
        } else {
          mkShowToast(data.error || '保存失败', true);
        }
      } catch (err) {
        mkShowToast('保存失败：' + err.message, true);
      }
      mkSaveBtn.disabled = false;
      mkSaveBtn.textContent = '保存配置';
    });

    // 重启 munchkin
    mkRestartBtn.addEventListener('click', async () => {
      if (!confirm('确定重启 Munchkin 服务？正在进行的对话会中断。')) return;
      mkRestartBtn.disabled = true;
      mkRestartBtn.textContent = '重启中...';
      try {
        const resp = await fetch('/api/agent/restart', { method: 'POST' });
        const data = await resp.json();
        if (resp.ok && data.success) {
          mkShowToast('已重启');
          setTimeout(() => mkLoadAll(), 3000); // 3 秒后刷新状态
        } else {
          mkShowToast(data.error || '重启失败', true);
        }
      } catch (err) {
        mkShowToast('重启失败：' + err.message, true);
      }
      mkRestartBtn.disabled = false;
      mkRestartBtn.textContent = '重启服务';
    });

    // 打开设置
    document.getElementById('agentSettingsBtn').addEventListener('click', () => {
      munchkinOverlay.classList.add('open');
      mkLoadAll();
    });
    // 关闭
    const closeMunchkinOverlay = () => { munchkinOverlay.classList.remove('open'); };
    munchkinOverlayClose.addEventListener('click', closeMunchkinOverlay);
    munchkinOverlay.addEventListener('click', (e) => {
      if (e.target === munchkinOverlay) closeMunchkinOverlay();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && munchkinOverlay.classList.contains('open')) closeMunchkinOverlay();
    });

    // ============================================================
    //  Skills / MCP CRUD 模态框
    // ============================================================

    // 插入两个编辑模态框 HTML(复用同一组 DOM,根据 mode 切换内容)
    const editorModalHtml = `
      <div class="mk-edit-modal" id="mkEditorModal">
        <div class="mk-edit-dialog">
          <div class="mk-edit-header">
            <span id="mkEditorTitle">编辑</span>
            <button class="mk-icon-btn" id="mkEditorClose">×</button>
          </div>
          <div class="mk-edit-body" id="mkEditorBody"></div>
          <div class="mk-edit-footer">
            <button class="mk-btn" id="mkEditorCancel">取消</button>
            <button class="mk-btn primary" id="mkEditorSave">保存</button>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', editorModalHtml);
    const mkEditorModal = document.getElementById('mkEditorModal');
    const mkEditorTitle = document.getElementById('mkEditorTitle');
    const mkEditorBody = document.getElementById('mkEditorBody');
    const mkEditorClose = document.getElementById('mkEditorClose');
    const mkEditorCancel = document.getElementById('mkEditorCancel');
    const mkEditorSave = document.getElementById('mkEditorSave');
    let mkEditorMode = null;  // 'skill-create' | 'skill-edit' | 'mcp-create' | 'mcp-edit'
    let mkEditorOriginalName = null;

    function mkCloseEditor() { mkEditorModal.classList.remove('open'); mkEditorMode = null; mkEditorOriginalName = null; }
    mkEditorClose.addEventListener('click', mkCloseEditor);
    mkEditorCancel.addEventListener('click', mkCloseEditor);
    mkEditorModal.addEventListener('click', (e) => { if (e.target === mkEditorModal) mkCloseEditor(); });

    // ---------- Skill 编辑器 ----------
    async function mkOpenSkillEditor(name) {
      // name 非空 = 编辑;空 = 新建
      let skill = { name: '', description: '', always: false, content: '' };
      if (name) {
        try {
          const resp = await fetch(`/api/agent/skills/${encodeURIComponent(name)}`);
          if (!resp.ok) throw new Error('读取失败');
          skill = await resp.json();
          mkEditorOriginalName = name;
          mkEditorMode = 'skill-edit';
          mkEditorTitle.textContent = `编辑 Skill: ${name}`;
        } catch (err) { mkShowToast('读取 skill 失败: ' + err.message, true); return; }
      } else {
        mkEditorMode = 'skill-create';
        mkEditorOriginalName = null;
        mkEditorTitle.textContent = '新建 Skill';
      }
      mkEditorBody.innerHTML = `
        <div class="mk-field">
          <label>名称(字母数字._-,首字符为字母数字)</label>
          <input type="text" id="mkSkillName" value="${skill.name.replace(/"/g, '&quot;')}" placeholder="如 my-workflow">
          <div class="mk-field-hint">将作为目录名,创建后改名会移动目录</div>
        </div>
        <div class="mk-field">
          <label>描述</label>
          <input type="text" id="mkSkillDesc" value="${(skill.description || '').replace(/"/g, '&quot;')}" placeholder="一句话说明这个 skill 做什么">
        </div>
        <div class="mk-field">
          <label class="mk-checkbox-row">
            <input type="checkbox" id="mkSkillAlways" ${skill.always ? 'checked' : ''}>
            常驻(always: true,每次对话都注入系统提示词)
          </label>
        </div>
        <div class="mk-field">
          <label>SKILL.md 正文(Markdown)</label>
          <textarea id="mkSkillContent" placeholder="# My Skill\n\n说明 agent 如何使用这个 skill...">${(skill.content || '').replace(/</g, '&lt;')}</textarea>
          <div class="mk-field-hint">frontmatter(name/description/always)会自动生成,只写正文</div>
        </div>
      `;
      mkEditorModal.classList.add('open');
    }

    // ---------- MCP server 编辑器 ----------
    async function mkOpenMcpEditor(name) {
      let server = { name: '', type: 'stdio', command: '', args: [], env: {}, enabledTools: ['*'], toolTimeout: 30, enabled: true };
      if (name) {
        // 从缓存中找
        const cached = (mkConfigCache?.mcpServers || []).find(s => s.name === name);
        if (cached) {
          server = { ...cached, enabled: cached.enabled };
        }
        mkEditorOriginalName = name;
        mkEditorMode = 'mcp-edit';
        mkEditorTitle.textContent = `编辑 MCP Server: ${name}`;
      } else {
        mkEditorMode = 'mcp-create';
        mkEditorOriginalName = null;
        mkEditorTitle.textContent = '新建 MCP Server';
      }
      const argsStr = Array.isArray(server.args) ? server.args.join('\n') : '';
      const envStr = Object.entries(server.env || {})
        .map(([k, v]) => `${k}=${v}`).join('\n');
      const enabledToolsStr = Array.isArray(server.enabledTools) && server.enabledTools[0] === '*'
        ? '*' : (server.enabledTools || []).join(', ');
      mkEditorBody.innerHTML = `
        <div class="mk-field">
          <label>名称</label>
          <input type="text" id="mkMcpName" value="${server.name.replace(/"/g, '&quot;')}" placeholder="如 filesystem">
        </div>
        <div class="mk-field">
          <label>类型(type)</label>
          <select id="mkMcpType">
            <option value="stdio" ${server.type === 'stdio' ? 'selected' : ''}>stdio(子进程)</option>
            <option value="sse" ${server.type === 'sse' ? 'selected' : ''}>sse(远程 HTTP)</option>
          </select>
        </div>
        <div class="mk-field">
          <label>命令(command)</label>
          <input type="text" id="mkMcpCommand" value="${(server.command || '').replace(/"/g, '&quot;')}" placeholder="如 python3 / npx / node">
          <div class="mk-field-hint">stdio 类型:可执行程序路径</div>
        </div>
        <div class="mk-field">
          <label>参数(args,每行一个)</label>
          <textarea id="mkMcpArgs" style="min-height:80px;" placeholder="/app/mcp-grist/server.py">${argsStr}</textarea>
        </div>
        <div class="mk-field">
          <label>环境变量(env,每行 KEY=VALUE)</label>
          <textarea id="mkMcpEnv" style="min-height:80px;" placeholder="GRIST_URL=http://grist:8484&#10;API_KEY=\${VAR}">${envStr}</textarea>
          <div class="mk-field-hint">支持 \${VAR} 语法引用容器环境变量</div>
        </div>
        <div class="mk-field">
          <label>启用工具(enabledTools,* 表示全部,或逗号分隔工具名)</label>
          <input type="text" id="mkMcpEnabledTools" value="${enabledToolsStr.replace(/"/g, '&quot;')}" placeholder="*">
        </div>
        <div class="mk-field">
          <label>工具超时秒数(toolTimeout)</label>
          <input type="number" id="mkMcpToolTimeout" value="${server.toolTimeout || 30}" min="1" max="300">
        </div>
        <div class="mk-field">
          <label class="mk-checkbox-row">
            <input type="checkbox" id="mkMcpEnabled" ${server.enabled ? 'checked' : ''}>
            启用此 MCP server
          </label>
        </div>
      `;
      mkEditorModal.classList.add('open');
    }

    // ---------- 保存编辑器 ----------
    mkEditorSave.addEventListener('click', async () => {
      mkEditorSave.disabled = true;
      mkEditorSave.textContent = '保存中...';
      try {
        if (mkEditorMode === 'skill-create' || mkEditorMode === 'skill-edit') {
          const body = {
            name: document.getElementById('mkSkillName').value.trim(),
            description: document.getElementById('mkSkillDesc').value.trim(),
            always: document.getElementById('mkSkillAlways').checked,
            content: document.getElementById('mkSkillContent').value,
          };
          if (!body.name) { mkShowToast('名称不能为空', true); return; }
          let resp;
          if (mkEditorMode === 'skill-edit') {
            resp = await fetch(`/api/agent/skills/${encodeURIComponent(mkEditorOriginalName)}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
          } else {
            resp = await fetch('/api/agent/skills', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
          }
          const data = await resp.json();
          if (resp.ok && data.success) {
            mkShowToast('已保存,需重启生效');
            mkCloseEditor();
            await mkLoadAll();
          } else {
            mkShowToast(data.error || '保存失败', true);
          }
        } else if (mkEditorMode === 'mcp-create' || mkEditorMode === 'mcp-edit') {
          const name = document.getElementById('mkMcpName').value.trim();
          const type = document.getElementById('mkMcpType').value;
          const command = document.getElementById('mkMcpCommand').value.trim();
          const argsText = document.getElementById('mkMcpArgs').value;
          const envText = document.getElementById('mkMcpEnv').value;
          const enabledToolsText = document.getElementById('mkMcpEnabledTools').value.trim();
          const toolTimeout = parseInt(document.getElementById('mkMcpToolTimeout').value, 10) || 30;
          const enabled = document.getElementById('mkMcpEnabled').checked;
          if (!name) { mkShowToast('名称不能为空', true); return; }
          const args = argsText.split('\n').map(s => s.trim()).filter(Boolean);
          const env = {};
          envText.split('\n').forEach(line => {
            const idx = line.indexOf('=');
            if (idx > 0) env[line.slice(0, idx).trim()] = line.slice(idx + 1);
          });
          const body = {
            name, type, command, args, env, toolTimeout,
            enabled,
            enabledTools: enabledToolsText === '*' ? ['*'] : enabledToolsText.split(',').map(s => s.trim()).filter(Boolean),
          };
          let resp;
          if (mkEditorMode === 'mcp-edit') {
            resp = await fetch(`/api/agent/mcp-servers/${encodeURIComponent(mkEditorOriginalName)}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
          } else {
            resp = await fetch('/api/agent/mcp-servers', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
          }
          const data = await resp.json();
          if (resp.ok && data.success) {
            mkShowToast('已保存,需重启生效');
            mkCloseEditor();
            await mkLoadAll();
          } else {
            mkShowToast(data.error || '保存失败', true);
          }
        }
      } catch (err) {
        mkShowToast('保存失败: ' + err.message, true);
      } finally {
        mkEditorSave.disabled = false;
        mkEditorSave.textContent = '保存';
      }
    });

    // ---------- 删除处理 ----------
    async function mkDeleteSkill(name) {
      if (!confirm(`确定删除自建 skill "${name}"?此操作不可恢复。`)) return;
      try {
        const resp = await fetch(`/api/agent/skills/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const data = await resp.json();
        if (resp.ok && data.success) {
          mkShowToast('已删除,需重启生效');
          await mkLoadAll();
        } else {
          mkShowToast(data.error || '删除失败', true);
        }
      } catch (err) { mkShowToast('删除失败: ' + err.message, true); }
    }

    async function mkDeleteMcp(name) {
      if (!confirm(`确定删除 MCP server "${name}"?此操作不可恢复。`)) return;
      try {
        const resp = await fetch(`/api/agent/mcp-servers/${encodeURIComponent(name)}`, { method: 'DELETE' });
        const data = await resp.json();
        if (resp.ok && data.success) {
          mkShowToast('已删除,需重启生效');
          await mkLoadAll();
        } else {
          mkShowToast(data.error || '删除失败', true);
        }
      } catch (err) { mkShowToast('删除失败: ' + err.message, true); }
    }

    // ---------- 拖动（通过 header） ----------
    let dragState = null;
    header.addEventListener('mousedown', (e) => {
      // 点击按钮时不触发拖动
      if (e.target.closest('.agent-icon-btn')) return;
      const rect = panel.getBoundingClientRect();
      dragState = {
        startX: e.clientX, startY: e.clientY,
        origLeft: rect.left, origTop: rect.top,
      };
      // 切换为 left/top 定位（脱离 right/bottom）
      panel.style.left = rect.left + 'px';
      panel.style.top = rect.top + 'px';
      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      document.body.style.cursor = 'move';
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      let newLeft = dragState.origLeft + dx;
      let newTop = dragState.origTop + dy;
      // 边界约束：至少保留部分在视口内
      const maxLeft = window.innerWidth - 80;
      const maxTop = window.innerHeight - 80;
      newLeft = Math.max(-panel.offsetWidth + 80, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));
      panel.style.left = newLeft + 'px';
      panel.style.top = newTop + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (dragState) {
        dragState = null;
        document.body.style.cursor = '';
      }
    });

    // ---------- 调整大小（通过左下角 handle） ----------
    let resizeState = null;
    resizeHandle.addEventListener('mousedown', (e) => {
      const rect = panel.getBoundingClientRect();
      const usesLeft = panel.style.left !== '' && panel.style.left !== 'auto';
      resizeState = {
        startX: e.clientX, startY: e.clientY,
        origWidth: rect.width, origHeight: rect.height,
        origLeft: rect.left, usesLeft,
      };
      document.body.style.cursor = 'sw-resize';
      e.preventDefault();
      e.stopPropagation();
    });
    document.addEventListener('mousemove', (e) => {
      if (!resizeState) return;
      const dx = e.clientX - resizeState.startX;
      const dy = e.clientY - resizeState.startY;
      // 左侧手柄：向左拖增大宽度，向右拖减小宽度
      const newWidth = Math.max(300, Math.min(resizeState.origWidth - dx, window.innerWidth - 20));
      const newHeight = Math.max(360, Math.min(resizeState.origHeight + dy, window.innerHeight - 20));
      panel.style.width = newWidth + 'px';
      panel.style.height = newHeight + 'px';
      // 若面板已用 left 定位（拖动过），需同步调整 left 保持右边固定
      if (resizeState.usesLeft) {
        panel.style.left = (resizeState.origLeft + (resizeState.origWidth - newWidth)) + 'px';
      }
    });
    document.addEventListener('mouseup', () => {
      if (resizeState) {
        resizeState = null;
        document.body.style.cursor = '';
      }
    });

    // 自适应输入框高度
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    // Enter 发送
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);

    function appendMessage(text, role) {
      const wrap = document.createElement('div');
      wrap.className = 'agent-msg agent-msg-' + role;
      const bubble = document.createElement('div');
      bubble.className = 'agent-msg-bubble';
      bubble.textContent = text;
      wrap.appendChild(bubble);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }
    function appendToolHint(text) {
      const tip = document.createElement('div');
      tip.className = 'agent-msg-tool';
      tip.textContent = '🔧 ' + text;
      messages.appendChild(tip);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      // WebSocket 未就绪：提示用户
      if (!ws || ws.readyState !== 1 || !chatId) {
        appendMessage('正在连接 Munchkin，请稍候...', 'bot');
        if (!ws || ws.readyState > 1) connectWebSocket();
        return;
      }
      appendMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      typing.style.display = 'flex';
      toolHint.textContent = '正在思考...';
      ws.send(JSON.stringify({ type: 'message', chat_id: chatId, content: text, webui: true }));
    }
  })();

</script>
</body>
</html>
