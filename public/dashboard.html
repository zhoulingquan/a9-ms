<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A9 Marketing System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" integrity="sha384-o5uz97et3bErHvpKfD4Jz4n0JfhJDWABFuF4NP+iEEDxE1VwMWJ19QGR0lqFZnr6" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack.min.css" integrity="sha384-v0+pyCGvaIDMe1HS4sAK/N5W4dvvEUFvTvAW9CmGumaXgHxaYO56Ow3DULWhd/kO" crossorigin="anonymous" />
<script src="https://cdn.jsdelivr.net/npm/gridstack@12.6.0/dist/gridstack-all.js" integrity="sha384-1/7H0y8C8vVEG2on7YuZQxUTtB+qMc+96SMFWVVl+0T6UVSVkgHg16yRwYVTFFoP" crossorigin="anonymous"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ========== Light Theme (default) ========== */
  :root, [data-theme="light"] {
    --g-primary: #16b378;
    --g-primary-dark: #009058;
    --g-primary-dim: #007548;
    --g-primary-light: rgba(22,179,120,0.12);
    --g-primary-emphasis: #b1ffe2;
    --g-body: #262633;
    --g-medium-text: #494949;
    --g-light-text: #929299;
    --g-bg: #ffffff;
    --g-bg-secondary: #f7f7f7;
    --g-bg-tertiary: rgba(217,217,217,0.6);
    --g-border: #d9d9d9;
    --g-border-light: #e8e8e8;
    --g-error: #d0021b;
    --g-warning: #dd962c;
    --g-info: #3b82f6;
    --g-selection: rgba(22,179,120,0.12);
    --g-overlay-bg: rgba(38,38,51,0.5);
    --g-map-marker: #16b378;
    --g-chart-axis: #494949;
    --g-chart-split: #e8e8e8;
    --g-badge-a: #d0021b;
    --g-badge-b: #dd962c;
    --g-badge-c: #3b82f6;
    --g-badge-active: #16b378;
    --g-badge-signed: #009058;
    --g-badge-negotiating: #929299;
    --g-badge-ended: #b0b0b0;
    --g-login-shadow: 0 8px 32px rgba(38,38,51,0.24);
    --g-popup-bg: #ffffff;
    --g-popup-border: #e8e8e8;
    --g-sidebar-bg: #f0f0f0;
    --g-sidebar-text: #494949;
    --g-sidebar-active-bg: rgba(22,179,120,0.15);
    --g-sidebar-active-text: #009058;
    --g-sidebar-hover-bg: rgba(0,0,0,0.04);
    --g-resize-grip: rgba(73,73,73,0.42);
    --g-resize-grip-bg: rgba(255,255,255,0.88);
    --g-sidebar-width: 220px;
    --g-sidebar-collapsed-width: 56px;
  }

  /* ========== Dark Theme ========== */
  [data-theme="dark"] {
    --g-primary: #17b378;
    --g-primary-dark: #1da270;
    --g-primary-dim: #157a54;
    --g-primary-light: rgba(22,179,120,0.18);
    --g-primary-emphasis: #13d78d;
    --g-body: #efefef;
    --g-medium-text: #d5d5d5;
    --g-light-text: #a4a4b1;
    --g-bg: #32323f;
    --g-bg-secondary: #262633;
    --g-bg-tertiary: rgba(111,111,125,0.6);
    --g-border: #70707d;
    --g-border-light: #60606d;
    --g-error: #e63946;
    --g-warning: #dd962c;
    --g-info: #3b82f6;
    --g-selection: rgba(22,179,120,0.18);
    --g-overlay-bg: rgba(0,0,0,0.6);
    --g-map-marker: #17b378;
    --g-chart-axis: #d5d5d5;
    --g-chart-split: #60606d;
    --g-badge-a: #e63946;
    --g-badge-b: #dd962c;
    --g-badge-c: #3b82f6;
    --g-badge-active: #17b378;
    --g-badge-signed: #1da270;
    --g-badge-negotiating: #a4a4b1;
    --g-badge-ended: #70707d;
    --g-login-shadow: 0 8px 32px rgba(0,0,0,0.5);
    --g-popup-bg: #32323f;
    --g-popup-border: #60606d;
    --g-sidebar-bg: #2a2a3a;
    --g-sidebar-text: #d5d5d5;
    --g-sidebar-active-bg: rgba(22,179,120,0.18);
    --g-sidebar-active-text: #17b378;
    --g-sidebar-hover-bg: rgba(255,255,255,0.05);
    --g-resize-grip: rgba(213,213,213,0.56);
    --g-resize-grip-bg: rgba(50,50,63,0.88);
  }

  html { font-size: 14px; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Liberation Sans,Helvetica,Arial,sans-serif;
    background: var(--g-bg-secondary); color: var(--g-body); line-height: 1.5;
    transition: background .2s, color .2s;
    display: flex; min-height: 100vh;
  }

  /* ========== Sidebar ========== */
  .sidebar {
    width: var(--g-sidebar-width); min-height: 100vh; background: var(--g-sidebar-bg);
    display: flex; flex-direction: column; flex-shrink: 0;
    transition: width .2s, background .2s; position: fixed; left: 0; top: 0; bottom: 0; z-index: 200;
  }
  .sidebar-brand {
    padding: 10px 10px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--g-border-light);
    position: relative; min-height: 48px;
  }
  .sidebar-brand .logo {
    width: 28px; height: 28px; border-radius: 3px; background: var(--g-primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 13px; flex-shrink: 0;
  }
  .sidebar-brand h1 { font-size: 14px; font-weight: 600; color: var(--g-body); white-space: nowrap; }
  .sidebar-toggle {
    margin-left: auto; width: 24px; height: 24px; border-radius: 3px;
    border: 1px solid var(--g-border); background: transparent; color: var(--g-sidebar-text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; transition: background .1s, color .1s, border-color .1s;
  }
  .sidebar-toggle:hover { background: var(--g-sidebar-hover-bg); color: var(--g-body); border-color: var(--g-primary); }
  .sidebar-nav { flex: 1; padding: 4px 0; overflow-y: auto; }
  .sidebar-section { padding: 10px 12px 4px; font-size: 11px; color: var(--g-sidebar-text); text-transform: uppercase; letter-spacing: .5px; opacity: .5; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px; margin: 1px 6px;
    color: var(--g-sidebar-text); font-size: 13px; font-weight: 400;
    cursor: pointer; transition: background .1s, color .1s; text-decoration: none; border: none;
    background: none; width: calc(100% - 12px); text-align: left; font-family: inherit;
    border-radius: 3px; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--g-sidebar-hover-bg); color: var(--g-body); }
  .nav-item.active { background: var(--g-sidebar-active-bg); color: var(--g-sidebar-active-text); border-left-color: var(--g-primary); }
  .nav-item .nav-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; flex-shrink: 0; opacity: .75; line-height: 1; }
  .nav-item.active .nav-icon { opacity: 1; }
  /* 长按拖动排序样式 */
  .nav-item.dragging { opacity: 0.4; }
  .nav-item.drag-over { border-top: 2px solid var(--g-primary); margin-top: 0; }
  .sidebar-footer {
    padding: 10px 12px; border-top: 1px solid var(--g-border-light);
    display: flex; align-items: center; gap: 8px;
  }
  .sidebar-footer .avatar {
    width: 24px; height: 24px; border-radius: 3px; background: var(--g-primary);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .sidebar-footer .user-name { color: var(--g-body); font-size: 13px; font-weight: 400; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-footer .btn-logout {
    padding: 2px 6px; border-radius: 3px; background: none; border: none;
    color: var(--g-sidebar-text); font-size: 11px; cursor: pointer; font-family: inherit;
    transition: color .1s;
  }
  .sidebar-footer .btn-logout:hover { color: var(--g-error); }

  /* ========== Main Area ========== */
  .main-area {
    flex: 1; margin-left: var(--g-sidebar-width); display: flex; flex-direction: column; min-height: 100vh;
    width: calc(100vw - var(--g-sidebar-width)); max-width: calc(100vw - var(--g-sidebar-width));
min-width: 0; overflow-x: clip; overflow-y: visible;
    transition: margin-left .2s, width .2s, max-width .2s;
  }
  body.sidebar-collapsed .sidebar { width: var(--g-sidebar-collapsed-width); }
  body.sidebar-collapsed .main-area {
    margin-left: var(--g-sidebar-collapsed-width);
    width: calc(100vw - var(--g-sidebar-collapsed-width));
    max-width: calc(100vw - var(--g-sidebar-collapsed-width));
  }
  body.sidebar-collapsed .sidebar-brand { justify-content: center; padding: 10px 8px; }
  body.sidebar-collapsed .sidebar-brand .logo { display: none; }
  body.sidebar-collapsed .sidebar-brand h1,
  body.sidebar-collapsed .sidebar-section,
  body.sidebar-collapsed .nav-label,
  body.sidebar-collapsed .sidebar-footer .user-name,
  body.sidebar-collapsed .sidebar-footer .btn-logout { display: none; }
  body.sidebar-collapsed .sidebar-toggle {
    position: static; margin-left: 0;
    background: var(--g-bg); color: var(--g-medium-text); border-color: var(--g-border-light);
    box-shadow: 0 1px 4px rgba(38,38,51,0.18);
  }
  body.sidebar-collapsed .sidebar-toggle:hover { color: var(--g-primary-dark); border-color: var(--g-primary); background: var(--g-bg); }
  body.sidebar-collapsed .nav-item { justify-content: center; padding: 9px 0; margin: 2px 6px; gap: 0; border-left-width: 0; width: calc(100% - 12px); }
  body.sidebar-collapsed .nav-item.active { border-left-width: 0; box-shadow: inset 3px 0 0 var(--g-primary); }
  body.sidebar-collapsed .sidebar-footer { justify-content: center; padding: 10px 8px; }
  body.sidebar-collapsed .sidebar-footer .avatar { width: 28px; height: 28px; }
  .btn-action {
    height: 28px; border-radius: 3px; border: 1px solid var(--g-border);
    background: var(--g-bg); color: var(--g-medium-text); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 0 10px;
    font-size: 12px; font-weight: 500; font-family: inherit; transition: all .1s;
  }
  .btn-action:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .btn-action.primary { background: var(--g-primary); border-color: var(--g-primary); color: #fff; }
  .btn-action.primary:hover { background: var(--g-primary-dark); border-color: var(--g-primary-dark); color: #fff; }
  .btn-symbol {
    width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; flex-shrink: 0;
  }

  /* ---- Top Bar ---- */
  .topbar {
    height: 40px; background: var(--g-bg); border-bottom: 1px solid var(--g-border-light);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; position: sticky; top: 0; z-index: 9998;
    transition: background .2s, border-color .2s;
  }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-title { font-size: 14px; font-weight: 600; color: var(--g-body); }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .btn-icon {
    width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--g-border);
    background: var(--g-bg); color: var(--g-medium-text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: all .1s;
  }
  .btn-icon:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }

  /* ---- Theme Switcher ---- */
  .theme-switcher { position: relative; display: inline-flex; }
  .theme-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--g-popup-bg); border: 1px solid var(--g-popup-border);
    border-radius: 3px; box-shadow: var(--g-login-shadow); min-width: 160px;
    z-index: 200; overflow: hidden;
  }
  .theme-dropdown.open { display: block; }
  .theme-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    cursor: pointer; font-size: 13px; color: var(--g-medium-text); transition: background .1s;
    border: none; background: none; width: 100%; text-align: left; font-family: inherit;
  }
  .theme-option:hover { background: var(--g-selection); }
  .theme-option.active { color: var(--g-primary-dark); font-weight: 600; }
  .theme-option .check { width: 16px; text-align: center; }

  /* ========== Content ========== */
  .content { flex: 1; padding: 20px 24px; position: relative; z-index: 0; }

  /* ---- Stats Cards ---- */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--g-bg); border-radius: 3px; padding: 14px 16px;
    border: 1px solid var(--g-border-light); transition: border-color .15s, background .2s;
  }
  .stat-card:hover { border-color: var(--g-primary); }
  .stat-card { position: relative; }
  .metric-close-btn {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px;
    border-radius: 3px; border: 1px solid var(--g-border); background: var(--g-bg);
    color: var(--g-light-text); cursor: pointer; display: none;
    align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .stat-card:hover .metric-close-btn { display: flex; }
  .metric-close-btn:hover { border-color: var(--g-error); color: var(--g-error); }
  .metric-add-btn {
    border: 2px dashed var(--g-border); border-radius: 3px; min-height: 80px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: border-color .15s, background .15s; background: transparent;
  }
  .metric-add-btn:hover { border-color: var(--g-primary); background: var(--g-primary-light); }
  .metric-add-inner { text-align: center; color: var(--g-light-text); }
  .metric-add-inner .plus { font-size: 24px; line-height: 1; }
  .metric-add-inner .text { font-size: 12px; margin-top: 2px; }
  .metric-edit-form { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .metric-edit-field label { display: block; font-size: 10px; color: var(--g-light-text); margin-bottom: 2px; font-weight: 500; }
  .metric-edit-field input, .metric-edit-field select { width: 100%; padding: 4px 6px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-body); font-size: 12px; font-family: inherit; }
  .metric-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .stat-card .label { font-size: 12px; color: var(--g-light-text); margin-bottom: 6px; font-weight: 500; }
  .stat-card .value { font-size: 1.7rem; font-weight: 700; color: var(--g-body); }
  .stat-card.accent { border-left: 3px solid var(--g-primary); }
  .stat-card.red    { border-left: 3px solid var(--g-error); }
  .stat-card.orange { border-left: 3px solid var(--g-warning); }
  .stat-card.blue   { border-left: 3px solid var(--g-info); }
  .stat-card.green  { border-left: 3px solid var(--g-primary); }
  .stat-card.gray   { border-left: 3px solid var(--g-light-text); }
  .metric-widget-value { padding: 18px 14px; font-size: 2rem; font-weight: 700; color: var(--g-body); }

  /* ---- Panels ---- */
  .panel {
    background: var(--g-bg); border-radius: 3px; margin-bottom: 12px;
    border: 1px solid var(--g-border-light); overflow: hidden; transition: background .2s, border-color .2s;
  }
  #mapPanel {
    position: relative;
    z-index: 0;
  }
  .panel-header {
    background: var(--g-bg); padding: 8px 14px; font-size: 13px; font-weight: 600;
    color: var(--g-medium-text); display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--g-border-light); transition: background .2s, border-color .2s;
  }
  .panel-body { padding: 14px; }

  /* ---- Map ---- */
  #map { height: 480px; width: 100%; margin-bottom: 12px; position: relative; z-index: 0; }
  #map.leaflet-container { overflow: hidden; }
  #map .leaflet-pane,
  #map .leaflet-tile,
  #map .leaflet-marker-icon,
  #map .leaflet-marker-shadow,
  #map .leaflet-tile-container,
  #map .leaflet-pane > svg,
  #map .leaflet-pane > canvas,
  #map .leaflet-zoom-box,
  #map .leaflet-image-layer,
  #map .leaflet-layer {
    position: absolute;
    left: 0;
    top: 0;
  }
  #map .leaflet-map-pane { z-index: 400; }
  #map .leaflet-tile-pane { z-index: 200; }
  #map .leaflet-overlay-pane { z-index: 400; }
  #map .leaflet-shadow-pane { z-index: 500; }
  #map .leaflet-marker-pane { z-index: 600; }
  #map .leaflet-tooltip-pane { z-index: 650; }
  #map .leaflet-popup-pane { z-index: 700; }
  #map .leaflet-top,
  #map .leaflet-bottom { position: absolute; z-index: 800; pointer-events: none; }
  #map .leaflet-top { top: 0; }
  #map .leaflet-right { right: 0; }
  #map .leaflet-bottom { bottom: 0; }
  #map .leaflet-left { left: 0; }
  #map .leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
  #map .leaflet-right .leaflet-control { float: right; }
  #map .leaflet-top .leaflet-control { margin-top: 10px; }
  #map .leaflet-bottom .leaflet-control { margin-bottom: 10px; }
  #map .leaflet-left .leaflet-control { margin-left: 10px; }
  #map .leaflet-right .leaflet-control { margin-right: 10px; }
  .map-controls { display: flex; align-items: center; gap: 6px; }
  .btn-fullscreen {
    all: unset;
    display: inline;
    color: var(--g-medium-text);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    padding: 2px 4px;
  }
  .btn-fullscreen:hover, .btn-fullscreen:focus, .btn-fullscreen:active, .btn-fullscreen:focus-visible {
    color: var(--g-primary-dark);
    outline: none;
  }

  /* ---- Native Chart Widgets ---- */
  .dashboard-row { margin-bottom: 12px; }
  .chart-widgets-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chart-widget-card { border: 1px solid var(--g-border-light); border-radius: 3px; overflow: hidden; background: var(--g-bg); }
  .chart-widget-card.span-2 { grid-column: span 2; }
  .chart-widget-card.editing { grid-column: 1 / -1; }
  .chart-widget-header { min-height: 38px; padding: 7px 10px; border-bottom: 1px solid var(--g-border-light); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chart-widget-title { font-size: 12px; font-weight: 600; color: var(--g-medium-text); }
  .chart-widget-scope { color: var(--g-light-text); font-size: 11px; font-weight: 400; margin-left: 6px; }
  .chart-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chart-action-btn { background: var(--g-bg); border: 1px solid var(--g-border); color: var(--g-medium-text); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .chart-action-btn:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .chart-action-btn.primary { background: var(--g-primary); border-color: var(--g-primary); color: #fff; }
  .chart-action-btn.primary:hover { background: var(--g-primary-dark); border-color: var(--g-primary-dark); color: #fff; }
  .chart-edit-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; border-top: 1px solid var(--g-border-light); }

  /* ---- Widget 操作菜单（"⋯" 下拉） ---- */
  .widget-menu { position: relative; flex-shrink: 0; }
  .widget-menu-btn {
    width: 18px; height: 18px; border: none; background: transparent;
    color: var(--g-light-text); cursor: pointer; font-size: 13px; line-height: 1;
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s; font-family: inherit;
  }
  .widget-menu-btn:hover { background: var(--g-selection); color: var(--g-primary-dark); }
  .widget-menu-dropdown {
    display: none; position: absolute; top: calc(100% + 2px); right: 0;
    min-width: 100px; background: var(--g-popup-bg); border: 1px solid var(--g-popup-border);
    border-radius: 4px; box-shadow: 0 4px 14px rgba(38,38,51,0.18);
    z-index: 100; overflow: hidden; padding: 4px 0;
  }
  .widget-menu-dropdown.open { display: block; }
  .widget-menu-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px;
    background: none; border: none; color: var(--g-medium-text); cursor: pointer;
    font-size: 12px; font-family: inherit; text-align: left; transition: background .1s, color .1s;
  }
  .widget-menu-item:hover { background: var(--g-selection); color: var(--g-primary-dark); }
  .widget-menu-item.is-danger:hover { background: rgba(208,2,27,0.1); color: var(--g-error); }
  .widget-menu-item .widget-menu-icon { width: 14px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .widget-menu-divider { height: 1px; background: var(--g-border-light); margin: 4px 0; }
  /* 编辑态时隐藏"⋯"菜单 */
  .grid-stack-item.editing .widget-menu { display: none; }
  /* 锁定状态：隐藏 widget 操作入口（菜单/收起/添加按钮），禁止拖拽手柄 */
  body.dashboard-locked .widget-menu,
  body.dashboard-locked .map-controls,
  body.dashboard-locked .add-widget-switcher { display: none !important; }
  body.dashboard-locked .grid-stack-item { cursor: default !important; }

  /* 添加组件按钮（下拉菜单风格，与主题切换器一致） */
  .add-widget-switcher { position: relative; display: inline-flex; }
  .add-widget-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    min-width: 140px; background: var(--g-popup-bg); border: 1px solid var(--g-popup-border);
    border-radius: 3px; box-shadow: 0 4px 16px rgba(38,38,51,0.18); z-index: 300;
    padding: 4px 0;
  }
  .add-widget-dropdown.open { display: block; }
  .add-widget-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 12px;
    background: none; border: none; color: var(--g-medium-text); cursor: pointer;
    font-size: 12px; font-family: inherit; text-align: left; transition: background .1s, color .1s;
  }
  .add-widget-item:hover { background: var(--g-selection); color: var(--g-primary-dark); }
  .add-widget-item .add-widget-icon { width: 14px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .native-chart { width: 100%; height: 320px; }

  /* ---- Gridstack 看板布局（参考 gridstackjs.cn 演示风格） ---- */
  .grid-stack {
    background: var(--g-bg-secondary);
    background-image:
      linear-gradient(to right, var(--g-border-light) 1px, transparent 1px),
      linear-gradient(to bottom, var(--g-border-light) 1px, transparent 1px);
    background-size: calc((100% - 11 * var(--gs-margin, 8px)) / 12 + var(--gs-margin, 8px)) 70px;
    border-radius: 4px;
    padding: 4px;
  }
  .grid-stack-item {
    border: 1px solid var(--g-border-light); border-radius: 4px; overflow: hidden;
    background: var(--g-bg);
    box-shadow: 0 1px 2px rgba(38,38,51,0.06);
    min-width: 0;
    transition: box-shadow .15s, border-color .15s;
  }
  .grid-stack-item:hover {
    border-color: var(--g-primary);
    box-shadow: 0 2px 8px rgba(22,179,120,0.18);
  }
  /* 拖拽/缩放进行中：高亮 + 阴影 + 轻微上浮 */
  .grid-stack-item.ui-draggable-dragging,
  .grid-stack-item.ui-resizable-resizing {
    box-shadow: 0 8px 24px rgba(38,38,51,0.28);
    z-index: 100;
    border-color: var(--g-primary);
    opacity: 0.95;
    transition: none;
  }
  .grid-stack-item-content {
    /* 必须保留 gridstack 默认的绝对定位撑满父级，否则 flex 子项高度塌陷、echarts 不渲染 */
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    padding: 0; display: flex; flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .grid-stack-item > .ui-resizable-handle {
    z-index: 120 !important;
    touch-action: none;
  }
  .grid-stack-item > .ui-resizable-e {
    width: 18px;
    top: 16px;
    right: 0;
    bottom: 36px;
    z-index: 120 !important;
  }
  .grid-stack-item > .ui-resizable-s {
    height: 18px;
    right: 36px;
    bottom: 0;
    left: 16px;
    z-index: 120 !important;
  }
  /* 缩放手柄：右下角可见的角点抓手 */
  .grid-stack-item > .ui-resizable-se {
    width: 36px; height: 36px; right: 0; bottom: 0;
    background: transparent !important; background-image: none !important;
    border-radius: 0 0 4px 0; opacity: 0; transition: opacity .15s;
    display: block !important;
    transform: none !important;
    cursor: nwse-resize !important; z-index: 140 !important;
  }
  .grid-stack-item > .ui-resizable-se::before {
    content: "";
    position: absolute;
    width: 20px; height: 20px; right: 6px; bottom: 6px;
    border-radius: 0 0 2px 0;
    pointer-events: none;
    background:
      linear-gradient(135deg, transparent 0 43%, var(--g-resize-grip) 45% 55%, transparent 57%) 11px 11px / 8px 8px no-repeat,
      linear-gradient(135deg, transparent 0 45%, var(--g-resize-grip) 47% 55%, transparent 57%) 6px 9px / 13px 13px no-repeat,
      linear-gradient(135deg, transparent 0 46%, var(--g-resize-grip) 48% 55%, transparent 57%) 1px 7px / 18px 18px no-repeat;
    filter: drop-shadow(0 1px 0 var(--g-resize-grip-bg));
    transition: background .15s, filter .15s;
  }
  .grid-stack-item:hover > .ui-resizable-se { opacity: 0.82; }
  .grid-stack-item > .ui-resizable-se:hover,
  .grid-stack-item.ui-resizable-resizing > .ui-resizable-se { opacity: 1; }
  .grid-stack-item > .ui-resizable-se:hover::before,
  .grid-stack-item.ui-resizable-resizing > .ui-resizable-se::before {
    background:
      linear-gradient(135deg, transparent 0 43%, var(--g-primary) 45% 55%, transparent 57%) 11px 11px / 8px 8px no-repeat,
      linear-gradient(135deg, transparent 0 45%, var(--g-primary) 47% 55%, transparent 57%) 6px 9px / 13px 13px no-repeat,
      linear-gradient(135deg, transparent 0 46%, var(--g-primary) 48% 55%, transparent 57%) 1px 7px / 18px 18px no-repeat;
    filter: drop-shadow(0 1px 0 var(--g-resize-grip-bg));
  }
  body.dashboard-locked .grid-stack-item > .ui-resizable-se { opacity: 0; pointer-events: none; }
  .grid-stack .widget-header {
    min-height: 14px; padding: 0 4px; border-bottom: 1px solid var(--g-border-light);
    display: flex; align-items: center; justify-content: space-between; gap: 2px; flex-shrink: 0;
    min-width: 0;
    cursor: move; /* 提示可拖拽 */
  }
  .grid-stack .widget-title { min-width: 0; font-size: 11px; font-weight: 600; color: var(--g-medium-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid-stack .widget-menu { min-width: 0; }
  .grid-stack .widget-body { flex: 1; min-width: 0; min-height: 0; position: relative; }
  .grid-stack .widget-body .native-chart { width: 100%; height: 100%; min-height: 0; }
  .grid-stack .widget-body .metric-value {
    display: flex; align-items: center; justify-content: center; height: 100%;
    font-size: 28px; font-weight: 700; color: var(--g-primary-dark);
  }
  .grid-stack .widget-body .metric-label { font-size: 11px; color: var(--g-light-text); text-align: center; padding: 6px 10px 0; }
  /* metric 卡片隐藏拖拽手柄的视觉，但仍可拖 */
  .grid-stack .grid-stack-item.is-metric .widget-body { display: flex; flex-direction: column; }
  .grid-stack .grid-stack-item.is-metric .widget-header { min-height: 16px; padding: 0 4px; }
  /* 拖拽占位符：虚线轮廓提示放置位置 */
  .grid-stack .grid-stack-placeholder {
    border: 2px dashed var(--g-primary); border-radius: 4px;
    background: var(--g-primary-light); opacity: 0.6;
  }
  .grid-stack .grid-stack-placeholder > .placeholder-content { display: none; }
  /* 添加按钮 */
  .widget-add-btn {
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 2px dashed var(--g-border); border-radius: 3px; min-height: 80px;
    transition: border-color .15s, background .15s; background: transparent;
  }
  .widget-add-btn:hover { border-color: var(--g-primary); background: var(--g-primary-light); }

  /* ---- Chart Edit Form ---- */
  .chart-edit-form { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--g-bg); }
  .chart-editor-section { padding-top: 12px; border-top: 1px solid var(--g-border-light); }
  .chart-editor-section:first-child { padding-top: 0; border-top: 0; }
  .chart-editor-section-title { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 11px; font-weight: 600; color: var(--g-medium-text); }
  .chart-editor-section-icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--g-primary-dark); font-size: 14px; line-height: 1; }
  .chart-editor-layout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .chart-editor-layout.single { grid-template-columns: 1fr; }
  .chart-edit-field label { display: block; font-size: 11px; color: var(--g-light-text); margin-bottom: 4px; font-weight: 500; }
  .chart-edit-field input,
  .chart-edit-field select { width: 100%; min-height: 32px; padding: 6px 8px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-body); font-size: 13px; font-family: inherit; }
  .chart-edit-field input:focus,
  .chart-edit-field select:focus { outline: none; border-color: var(--g-primary); box-shadow: 0 0 0 2px var(--g-primary-light); }
  .chart-edit-field select:disabled { color: var(--g-light-text); background: var(--g-bg-secondary); cursor: not-allowed; }
  .chart-edit-metric { display: grid; grid-template-columns: minmax(98px, .8fr) minmax(140px, 1.2fr); gap: 8px; }
  .chart-edit-metric select { min-width: 0; }
  .chart-edit-hint { margin-top: 4px; color: var(--g-light-text); font-size: 11px; line-height: 1.35; }
  .chart-edit-type-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .chart-type-btn { min-height: 34px; padding: 6px 8px; border: 1px solid var(--g-border); border-radius: 3px; background: var(--g-bg); color: var(--g-medium-text); cursor: pointer; font-size: 12px; font-family: inherit; transition: all .1s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .chart-type-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--g-light-text); font-size: 14px; line-height: 1; }
  .chart-type-btn:hover { border-color: var(--g-primary); color: var(--g-primary-dark); }
  .chart-type-btn.active { border-color: var(--g-primary); background: var(--g-primary-light); color: var(--g-primary-dark); font-weight: 600; }
  .chart-type-btn.active .chart-type-icon { color: var(--g-primary-dark); }

  /* ---- Add Chart Placeholder ---- */
  .chart-add-btn { border: 2px dashed var(--g-border); border-radius: 3px; height: 120px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color .15s, background .15s; background: transparent; }
  .chart-add-btn:hover { border-color: var(--g-primary); background: var(--g-primary-light); }
  .chart-add-inner { text-align: center; color: var(--g-light-text); }
  .chart-add-inner .plus { font-size: 28px; line-height: 1; }
  .chart-add-inner .text { font-size: 13px; margin-top: 4px; }

  /* ---- Map Collapse ---- */
  #mapPanel.map-collapsed #map, .grid-stack-item.is-map-widget.map-collapsed #map {
    display: none;
  }
  /* 地图 widget 内 #map 撑满 widget-body */
  .grid-stack-item.is-map-widget .widget-body { position: relative; min-height: 0; }
  .grid-stack-item.is-map-widget #map { width: 100%; height: 100%; margin: 0; position: relative; z-index: 0; }

  /* ---- Admin Panel ---- */
  .admin-panel {
    background: var(--g-bg); border: 1px solid var(--g-border-light);
    border-radius: 4px; padding: 20px 24px;
  }
  .admin-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .admin-header h3 { font-size: 16px; font-weight: 600; color: var(--g-body); }
  .admin-tip {
    font-size: 12px; color: var(--g-light-text); margin: 0 0 16px;
    line-height: 1.6;
  }
  .admin-table-wrap { overflow-x: auto; }
  .admin-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .admin-table th, .admin-table td {
    padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--g-border-light);
  }
  .admin-table th {
    font-weight: 600; color: var(--g-medium-text); background: var(--g-bg-secondary);
    font-size: 12px; text-transform: uppercase; letter-spacing: .3px;
  }
  .admin-table tr:hover td { background: var(--g-selection); }
  .admin-table .admin-empty {
    text-align: center; color: var(--g-light-text); padding: 28px;
  }
  .admin-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
  }
  .admin-badge.source-local { background: var(--g-primary-light); color: var(--g-primary-dark); }
  .admin-badge.source-grist { background: var(--g-bg-tertiary); color: var(--g-medium-text); }
  .admin-badge.role-admin { background: var(--g-badge-a); color: #fff; }
  .admin-badge.role-user { background: var(--g-bg-tertiary); color: var(--g-medium-text); }
  .admin-toggle {
    position: relative; display: inline-block; width: 36px; height: 20px; cursor: pointer;
  }
  .admin-toggle input { opacity: 0; width: 0; height: 0; }
  .admin-toggle .slider {
    position: absolute; inset: 0; background: var(--g-border); border-radius: 10px;
    transition: background .15s;
  }
  .admin-toggle .slider::before {
    content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .admin-toggle input:checked + .slider { background: var(--g-primary); }
  .admin-toggle input:checked + .slider::before { transform: translateX(16px); }
  .admin-toggle input:disabled + .slider { opacity: .5; cursor: not-allowed; }

  /* ---- Overlays ---- */
  .login-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: var(--g-overlay-bg); justify-content: center; align-items: center;
    padding: 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .login-overlay.active { display: flex; }
  .login-box {
    background: var(--g-bg); border-radius: 6px; box-shadow: var(--g-login-shadow);
    width: 100%; max-width: 360px; overflow: hidden;
  }
  .login-header {
    padding: 24px 24px 16px; text-align: center;
    border-bottom: 1px solid var(--g-border-light);
  }
  .login-header .logo {
    width: 48px; height: 48px; border-radius: 8px; background: var(--g-primary);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 20px; margin-bottom: 12px;
  }
  .login-header h2 {
    font-size: 18px; font-weight: 600; color: var(--g-body); margin: 0;
  }
  .login-body { padding: 20px 24px; }
  .login-form { margin-top: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 12px; font-weight: 500; color: var(--g-medium-text);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--g-border);
    border-radius: 4px; background: var(--g-bg); color: var(--g-body);
    font-size: 14px; font-family: inherit; box-sizing: border-box;
  }
  .form-group input:focus {
    outline: none; border-color: var(--g-primary);
    box-shadow: 0 0 0 2px var(--g-primary-light);
  }
  .login-error {
    color: var(--g-error); font-size: 13px; min-height: 20px;
    text-align: center;
  }
  .login-footer { padding: 0 24px 24px; }
  .btn-login {
    width: 100%; padding: 12px; border: none; border-radius: 4px;
    background: var(--g-primary); color: #fff; font-size: 14px;
    font-weight: 600; cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .btn-login:hover { background: var(--g-primary-dark); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  body.login-active .sidebar,
  body.login-active .main-area { filter: blur(4px); pointer-events: none; user-select: none; transition: filter .3s; }

  /* ---- Print ---- */
  @media print {
    .sidebar, .topbar, .btn-fullscreen, .footer { display: none !important; }
    .main-area { margin-left: 0; }
    .panel { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
    .stat-card { box-shadow: none; border: 1px solid #ddd; }
    #map { height: 400px; }
    body { background: #fff; }
  }

  /* ---- Responsive ---- */
  @media (max-width: 980px) {
    .chart-widgets-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .sidebar { width: var(--g-sidebar-collapsed-width); }
    .sidebar .nav-item .nav-label,
    .sidebar-brand h1,
    .sidebar-section,
    .sidebar-footer .user-name,
    .sidebar-footer .btn-logout { display: none; }
    .sidebar-brand { justify-content: center; padding: 12px; }
    .nav-item { justify-content: center; padding: 10px; }
    .sidebar-footer { justify-content: center; }
    .main-area { margin-left: var(--g-sidebar-collapsed-width); }
    .stats-grid { gap: 8px; }
    .stat-card .value { font-size: 1.3rem; }
    .chart-editor-layout,
    .chart-edit-metric,
    .chart-edit-type-group { grid-template-columns: 1fr; }
    #map { height: 320px; }
    .content { padding: 12px; }
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="logo">A9</div>
    <h1>A9 Marketing</h1>
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">‹</button>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-section">主菜单</div>
    <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
      <span class="nav-icon">▦</span><span class="nav-label">数据看板</span>
    </button>
    <button class="nav-item" id="navAdmin" data-page="admin" onclick="switchPage('admin')" style="display:none;">
      <span class="nav-icon">⚙</span><span class="nav-label">账户管理</span>
    </button>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter" style="display:none;">
    <div class="avatar" id="sidebarAvatar">A</div>
    <span class="user-name" id="sidebarUserName"></span>
    <button class="btn-logout" onclick="doLogout()" title="退出登录">⏻</button>
  </div>
</aside>

<!-- Main Area -->
<div class="main-area">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-title" id="topbarTitle">数据看板</span>
    </div>
    <div class="topbar-right">
      <button class="btn-action primary" id="btnOpenGrist" onclick="openGrist()"><span class="btn-symbol">▤</span>多维表格</button>
      <button class="btn-icon" id="btnLock" onclick="toggleLock()" title="锁定/解锁看板" aria-label="锁定/解锁看板">⊙</button>
      <div class="add-widget-switcher">
        <button class="btn-icon" id="addWidgetBtn" onclick="toggleAddWidgetMenu()" title="添加组件">＋</button>
        <div class="add-widget-dropdown" id="addWidgetDropdown">
          <button class="add-widget-item" onclick="addWidget('metric'); closeAddWidgetMenu()"><span class="add-widget-icon">#</span>指标卡片</button>
          <button class="add-widget-item" onclick="addWidget('bar'); closeAddWidgetMenu()"><span class="add-widget-icon">▤</span>柱状图</button>
          <button class="add-widget-item" onclick="addWidget('pie'); closeAddWidgetMenu()"><span class="add-widget-icon">◐</span>饼图</button>
          <button class="add-widget-item" onclick="addWidget('line'); closeAddWidgetMenu()"><span class="add-widget-icon">⌇</span>折线图</button>
        </div>
      </div>
      <div class="theme-switcher">
        <button class="btn-icon" id="themeBtn" onclick="toggleThemeMenu()" title="切换主题">◐</button>
        <div class="theme-dropdown" id="themeDropdown">
          <button class="theme-option" data-theme="light" onclick="setTheme('light')">
            <span class="check" id="check-light"></span> ☀️ 亮色
          </button>
          <button class="theme-option" data-theme="dark" onclick="setTheme('dark')">
            <span class="check" id="check-dark"></span> 🌙 暗色
          </button>

            <span class="check" id="check-system"></span> 💻 跟随系统
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Content -->
  <div class="content">
    <!-- Page: Dashboard -->
    <div id="pageDashboard">
      <!-- Widget Grid (metric + chart + map 统一用 gridstack 管理) -->
      <div class="dashboard-row widgets-row">
        <div class="grid-stack" id="widgetGrid"></div>
      </div>

      <div class="footer" id="footerInfo">数据加载中…</div>
    </div>

    <!-- Page: Admin -->
    <div id="pageAdmin" style="display:none;">
      <div class="admin-panel">
        <div class="admin-header">
          <h3>用户管理</h3>
          <button class="btn-action" onclick="loadAdminUsers()"><span class="btn-symbol">↻</span>刷新</button>
        </div>
        <p class="admin-tip">勾选「允许访问 Grist」后，该用户在前端将看到「多维表格」入口按钮；未勾选则隐藏。管理员邮箱由环境变量 ADMIN_EMAILS 配置。</p>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>邮箱</th>
                <th>姓名</th>
                <th>来源</th>
                <th>角色</th>
