<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A9 Marketing System</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: #f0f4f8;
    color: #1a2332;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .app-header {
    background: linear-gradient(135deg, #0d2b4e 0%, #1a4a7a 100%);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .app-header .subtitle { font-size: 13px; opacity: .75; margin-top: 4px; }
  .user-info {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto; padding-left: 16px;
    border-left: 1px solid rgba(255,255,255,.2);
  }
  .user-display { font-size: 13px; font-weight: 600; color: #fff; }
  .btn-logout {
    padding: 5px 14px; border: 1px solid rgba(255,255,255,.3);
    border-radius: 6px; background: transparent; color: #fff;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all .2s; font-family: inherit;
  }
  .btn-logout:hover { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.5); }

  /* Main */
  .main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  /* Card Grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
    max-width: 1100px;
    width: 100%;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    transition: transform .2s, box-shadow .2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    border: 2px solid transparent;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    border-color: #1a4a7a;
  }

  .card-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    margin-bottom: 18px;
  }
  .card-icon.blue { background: #eff6ff; color: #1a4a7a; }
  .card-icon.green { background: #f0fdf4; color: #16a34a; }
  .card-icon.purple { background: #faf5ff; color: #9333ea; }

  .card h2 { font-size: 18px; font-weight: 700; color: #0d2b4e; margin-bottom: 8px; }
  .card p { font-size: 14px; color: #64748b; line-height: 1.6; }
  .card .card-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 16px; font-size: 14px; font-weight: 600;
    color: #1a4a7a; transition: gap .2s;
  }
  .card:hover .card-link { gap: 8px; }

  /* Login Overlay */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.5); justify-content: center; align-items: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: #fff; border-radius: 12px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-header {
    display: flex; justify-content: center; align-items: center;
    padding: 20px 24px; border-bottom: 1px solid #e2e8f0;
  }
  .modal-header h2 { font-size: 20px; color: #0d2b4e; }
  .modal-body { padding: 20px 24px; }
  .modal-footer {
    display: flex; justify-content: center;
    padding: 16px 24px; border-top: 1px solid #e2e8f0;
  }
  .login-form .form-group { margin-bottom: 18px; }
  .login-form label {
    display: block; font-size: 14px; font-weight: 600;
    color: #334155; margin-bottom: 6px;
  }
  .login-form input {
    width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 15px; font-family: inherit;
    outline: none; transition: border-color .2s, box-shadow .2s; box-sizing: border-box;
  }
  .login-form input:focus {
    border-color: #1a4a7a; box-shadow: 0 0 0 3px rgba(26,74,122,.15);
  }
  .login-error { color: #dc2626; font-size: 13px; text-align: center; min-height: 22px; margin-top: 4px; }
  .btn-login {
    padding: 10px 40px; border: none; border-radius: 8px;
    background: #1a4a7a; color: #fff; font-size: 15px;
    font-weight: 600; cursor: pointer; transition: background .2s;
    font-family: inherit;
  }
  .btn-login:hover { background: #0d2b4e; }
  .btn-login:disabled { opacity: .6; cursor: not-allowed; }

  /* Responsive */
  @media (max-width: 768px) {
    .app-header { padding: 14px 16px; }
    .app-header h1 { font-size: 17px; }
    .card-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div>
    <h1>A9 Marketing System</h1>
    <div class="subtitle">A9 客户台账管理系统 v3.0</div>
  </div>
  <div class="user-info" id="userInfo" style="display:none;">
    <span class="user-display" id="userDisplay"></span>
    <button class="btn-logout" onclick="doLogout()">退出</button>
  </div>
</header>

<!-- Main Content -->
<div class="main-content">
  <div class="card-grid">
    <!-- Grist 多维表格 -->
    <a class="card" id="gristCard" href="#" target="_blank">
      <div class="card-icon blue">📊</div>
      <h2>客户台账管理</h2>
      <p>使用 Grist 多维表格管理客户数据，支持网格视图、看板、图表、表单、Python 公式、筛选排序分组等高级功能。</p>
      <span class="card-link">进入表格 →</span>
    </a>

    <!-- 统计看板 -->
    <a class="card" href="/dashboard.html">
      <div class="card-icon green">🗺️</div>
      <h2>数据统计看板</h2>
      <p>查看客户分布地图、评级分布图表、区域统计等可视化数据，支持全屏查看和打印。</p>
      <span class="card-link">查看看板 →</span>
    </a>

    <!-- A9Bot AI 助手 -->
    <a class="card" id="a9botCard" href="/chat/" style="display:none;">
      <div class="card-icon purple">🤖</div>
      <h2>A9Bot AI 助手</h2>
      <p>AI 智能助手，可查询客户数据、分析统计趋势、生成报告，支持自然语言交互。</p>
      <span class="card-link">开始对话 →</span>
    </a>
  </div>
</div>

<!-- Login Overlay -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>A9 Marketing System</h2>
    </div>
    <div class="modal-body">
      <p style="text-align:center;color:#64748b;margin:0 0 18px;font-size:13px;">请登录以继续</p>
      <div class="login-form">
        <div class="form-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" placeholder="请输入邮箱" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="login-error" id="loginError"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;

// 全局 fetch 拦截器
const _origFetch = window.fetch;
window.fetch = async function(url, opts) {
  opts = opts || {};
  if (!opts.credentials) opts.credentials = 'same-origin';
  const res = await _origFetch(url, opts);
  if (res.status === 401 && typeof url === 'string' && !url.includes('/api/auth/')) {
    const data = await res.clone().json().catch(() => ({}));
    if (data.code === 'AUTH_REQUIRED') {
      currentUser = null;
      document.getElementById('userInfo').style.display = 'none';
      showLogin();
    }
  }
  return res;
};

async function init() {
  try {
    // 获取 Grist URL 配置
    const healthRes = await fetch('/api/health');
    if (healthRes.ok) {
      const health = await healthRes.json();
      const gristCard = document.getElementById('gristCard');
      if (gristCard && health.gristUrl) {
        gristCard.href = health.gristUrl;
      }
      // A9Bot 启用时显示入口
      const a9botCard = document.getElementById('a9botCard');
      if (a9botCard && health.a9bot && health.a9bot !== 'stopped') {
        a9botCard.style.display = '';
      }
    }

    const res = await fetch('/api/auth/me');
    if (res.ok) {
      const data = await res.json();
      if (data.authenticated) {
        currentUser = data.user;
        updateHeaderUser();
        // 已登录用户访问首页时自动跳转到看板
        window.location.href = '/dashboard.html';
        return;
      }
    }
  } catch (e) { /* ignore */ }
  showLogin();
}

function showLogin() {
  const overlay = document.getElementById('loginOverlay');
  if (!overlay) return;
  overlay.classList.add('active');
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginBtn').disabled = false;
  document.getElementById('loginBtn').textContent = '登 录';
  setTimeout(() => document.getElementById('loginEmail').focus(), 100);
  document.getElementById('loginPassword').onkeydown = (e) => {
    if (e.key === 'Enter') doLogin();
  };
}

function hideLogin() {
  const overlay = document.getElementById('loginOverlay');
  if (overlay) overlay.classList.remove('active');
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!email || !password) {
    errorEl.textContent = '请输入邮箱和密码';
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';
  errorEl.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error || '登录失败';
      btn.disabled = false;
      btn.textContent = '登 录';
      return;
    }
    currentUser = data.user;
    hideLogin();
    // 登录成功后跳转到看板
    window.location.href = '/dashboard.html';
  } catch (e) {
    errorEl.textContent = '网络连接失败，请检查服务器';
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

async function doLogout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } catch (e) { /* ignore */ }
  currentUser = null;
  document.getElementById('userInfo').style.display = 'none';
  showLogin();
}

function updateHeaderUser() {
  const infoEl = document.getElementById('userInfo');
  const displayEl = document.getElementById('userDisplay');
  if (!infoEl || !displayEl) return;
  if (currentUser) {
    infoEl.style.display = 'flex';
    displayEl.textContent = '👤 ' + (currentUser.displayName || currentUser.email || '');
  } else {
    infoEl.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
