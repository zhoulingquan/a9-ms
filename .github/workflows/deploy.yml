name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master  # 当 master 分支有新推送时触发
  pull_request:
    branches:
      - master  # 当有 PR 合并到 master 时触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --verbose

      - name: Upload static assets to KV
        run: |
          npx wrangler kv:key put "/index.html" --path "public/index.html" --binding A9_MS_KV --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully!"
          echo "Worker URL: https://a9-ms-worker.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
