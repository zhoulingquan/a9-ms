# ============================================================
#  supervisord — 单容器管理 A9 (Node) + Munchkin (Python) 双进程
# ============================================================
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ---------- A9 App (Node.js Express 门户) ----------
[program:app]
command=node app/server.js
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/app.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/app.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=HOME="/app",NODE_ENV="production"

# ---------- Munchkin Gateway (Python AI Agent) ----------
[program:munchkin]
command=munchkin gateway
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/munchkin.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/munchkin.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
environment=HOME="/home/munchkin",MUNCHKIN_HOME="/home/munchkin/.munchkin"
