<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A9 AI Agent — 智能填表助手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: #f0f4f8; height: 100vh; display: flex; flex-direction: column; }

  header {
    background: linear-gradient(135deg, #0d2b4e, #1a4a7a); color: #fff;
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .header-status { font-size: 12px; opacity: .8; }

  .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 0 16px; overflow: hidden; }

  .messages { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 12px; }
  .messages:empty::after { content: '输入消息或上传 Excel 开始操作'; display: block; text-align: center; color: #94a3b8; padding: 60px 20px; font-size: 15px; }

  .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; word-wrap: break-word; animation: fadeIn .2s; }
  .msg.user { align-self: flex-end; background: #1a4a7a; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #fff; color: #1a2332; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .msg.system { align-self: center; background: #fef3c7; color: #92400e; font-size: 13px; border-radius: 8px; padding: 8px 16px; max-width: 90%; }

  .msg pre { background: #f1f5f9; border-radius: 6px; padding: 10px; overflow-x: auto; font-size: 13px; margin: 8px 0 0; }
  .msg code { font-family: "SF Mono", Consolas, monospace; font-size: 13px; }
  .msg p { margin: 4px 0; }

  .input-area { display: flex; gap: 8px; padding: 12px 0 20px; flex-shrink: 0; align-items: flex-end; }
  .input-area textarea {
    flex: 1; resize: none; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 14px;
    font-size: 14px; font-family: inherit; outline: none; line-height: 1.5; min-height: 44px; max-height: 120px;
    transition: border-color .2s;
  }
  .input-area textarea:focus { border-color: #1a4a7a; box-shadow: 0 0 0 3px rgba(26,74,122,.15); }
  .input-area button {
    padding: 10px 20px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .2s; white-space: nowrap; font-family: inherit;
  }
  .btn-send { background: #1a4a7a; color: #fff; }
  .btn-send:hover { background: #0d2b4e; }
  .btn-send:disabled { opacity: .5; cursor: not-allowed; }
  .btn-upload { background: #8b5cf6; color: #fff; }
  .btn-upload:hover { background: #7c3aed; }

  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes typing { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-shrink: 0; padding: 8px 0; }
  .toolbar .hint { font-size: 12px; color: #94a3b8; }
  .toolbar .btn-reset-chat { font-size: 12px; padding: 4px 12px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #64748b; cursor: pointer; font-family: inherit; }
  .toolbar .btn-reset-chat:hover { background: #f1f5f9; }

  .msg-actions { margin-top: 8px; display: flex; gap: 8px; }
  .msg-actions button { font-size: 12px; padding: 3px 10px; border: 1px solid #e2e8f0; border-radius: 4px; background: #fff; cursor: pointer; color: #64748b; }
  .msg-actions button:hover { background: #f1f5f9; }
</style>
</head>
<body>

<header>
  <h1>🤖 A9 AI Agent — 智能填表助手</h1>
  <span class="header-status" id="statusBadge">⏳ 连接中...</span>
</header>

<div class="chat-container">
  <div class="messages" id="messages"></div>

  <div class="toolbar">
    <button class="btn-reset-chat" onclick="resetChat()">🗑 清空对话</button>
    <span class="hint">Enter 发送 · Shift+Enter 换行</span>
  </div>

  <div class="input-area">
    <textarea id="input" rows="1" placeholder="输入客户信息，例如：帮我加一个客户，北京地区，航天科技，A级..." onkeydown="onKeydown(event)"></textarea>
    <button class="btn-upload" onclick="document.getElementById('fileInput').click()" title="上传 Excel 文件">📎</button>
    <input type="file" id="fileInput" accept=".xlsx,.md" style="display:none" onchange="uploadFile(event)">
    <button class="btn-send" id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusBadge = document.getElementById('statusBadge');

// ---------- 连接状态 ----------
async function checkStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.connected) {
      statusBadge.textContent = `✅ 已连接 · ${data.aiProvider} / ${data.aiModel}`;
    } else {
      statusBadge.textContent = `❌ ${data.error || 'A9 未连接'}`;
    }
  } catch (e) {
    statusBadge.textContent = '❌ Agent 服务异常';
  }
}
checkStatus();

// ---------- 消息渲染 ----------
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  if (role === 'assistant') {
    // 简单 Markdown 渲染
    let html = content
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    div.innerHTML = html;

    // 添加复制按钮
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '📋 复制';
    copyBtn.onclick = () => { navigator.clipboard.writeText(content); copyBtn.textContent = '✅ 已复制'; setTimeout(() => copyBtn.textContent = '📋 复制', 2000); };
    actions.appendChild(copyBtn);
    div.appendChild(actions);
  } else {
    div.textContent = content;
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typingIndicator';
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function setLoading(loading) {
  sendBtn.disabled = loading;
  sendBtn.textContent = loading ? '处理中...' : '发送';
  inputEl.disabled = loading;
}

// ---------- 发送消息 ----------
async function send() {
  const msg = inputEl.value.trim();
  if (!msg) return;

  addMessage('user', msg);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  setLoading(true);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    hideTyping();
    if (data.reply) {
      addMessage('assistant', data.reply);
    } else if (data.error) {
      addSystemMsg('❌ ' + data.error);
    }
  } catch (e) {
    hideTyping();
    addSystemMsg('❌ 请求失败: ' + e.message);
  }

  setLoading(false);
  inputEl.focus();
}

// ---------- 键盘事件 ----------
function onKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
  // 自动调整高度
  setTimeout(() => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }, 0);
}

// ---------- 上传文件 ----------
async function uploadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  addSystemMsg(`📄 正在解析文件: ${file.name}...`);
  setLoading(true);

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    hideTyping();
    if (data.reply) {
      // 移除系统消息，替换为 AI 回复
      const systemMsgs = messagesEl.querySelectorAll('.msg.system');
      if (systemMsgs.length > 0) systemMsgs[systemMsgs.length - 1].remove();
      addMessage('assistant', data.reply);
    } else if (data.error) {
      addSystemMsg('❌ ' + data.error);
    }
  } catch (e) {
    addSystemMsg('❌ 上传失败: ' + e.message);
  }

  setLoading(false);
}

// ---------- 重置对话 ----------
async function resetChat() {
  try {
    await fetch('/api/reset', { method: 'POST' });
  } catch (e) {}
  messagesEl.innerHTML = '';
  addSystemMsg('🔄 对话已重置');
}
</script>
</body>
</html>
